<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Read.Log">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>

<title>READ.LOG</title>
<style>
@font-face { font-family: "Silkscreen"; src: url("fonts/silkscreen-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: "VT323"; src: url("fonts/vt323-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
:root {
  --ink: #111111;
  --paper: #F4F4F4;
  --mid: #D6D6D6;
  --gray: #8A8A8A;
  --dim: #555555;
  --label: #C8C8C8;
  --mouse: #9B948F;
  --rose: #E26A8C;
  --pixel: "Silkscreen", ui-monospace, Menlo, monospace;
  --term: "VT323", ui-monospace, Menlo, monospace;
  --n4: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  --n2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --tab-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body {
  background-color: var(--paper);
  background-image: conic-gradient(var(--mid) 25%, var(--paper) 0 50%, var(--mid) 0 75%, var(--paper) 0);
  background-size: 4px 4px;
}
body { margin: 0; color: var(--ink); font: 22px/1.15 var(--term); min-height: 100dvh; overscroll-behavior-y: none; -webkit-font-smoothing: none; }
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
svg { display: block; }
[hidden] { display: none !important; }
.ico { flex: none; }

.app { max-width: 520px; margin: 0 auto; padding: calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + var(--tab-h) + 28px) calc(var(--sl) + 16px); }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-sq { width: 14px; height: 14px; background: var(--rose); border: 2px solid var(--ink); flex: none; }
.logo-txt { font: 700 20px/1 var(--pixel); }
.date { font: 24px/1 var(--term); white-space: nowrap; }

/* ---------- stepped (notched) boxes: ink outer w/ 4px notch, fill inner w/ 2px notch ---------- */
.bo { display: block; background: var(--ink); padding: 2px; clip-path: var(--n4); }
.bi { display: block; background: var(--paper); clip-path: var(--n2); }

/* windows */
.win { filter: drop-shadow(4px 4px 0 var(--ink)); margin: 0 4px 26px 0; }
.tb {
  position: relative; height: 26px; padding: 5px 4px; border-bottom: 2px solid var(--ink);
  background: repeating-linear-gradient(to bottom, var(--ink) 0 2px, var(--paper) 2px 4px) content-box, var(--paper);
  display: flex; align-items: center; justify-content: center;
}
.tb-label { background: var(--paper); padding: 0 8px; font: 700 13px/16px var(--pixel); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 72px); display: flex; align-items: center; gap: 6px; }
.tb-box { position: absolute; left: 8px; top: 4px; width: 16px; height: 16px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--paper); }
.tb-close { position: absolute; left: 0; top: 0; width: 48px; height: 24px; }
.tb-close::after { content: ""; position: absolute; left: 8px; top: 4px; width: 16px; height: 16px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--paper); }
.tb-close:active::after { background: var(--ink); }
.wb { padding: 16px; }
.wb.flush { padding: 0; }

/* buttons */
.btn { display: block; width: 100%; filter: drop-shadow(4px 4px 0 var(--ink)); transition: transform .12s steps(1), filter .12s steps(1); }
.btn .bi { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; font: 700 16px/1 var(--pixel); text-transform: uppercase; white-space: nowrap; }
.btn.primary { filter: drop-shadow(4px 4px 0 var(--gray)); }
.btn.primary .bi { background: var(--rose); color: var(--ink); }
.btn.dark .bi { background: var(--ink); color: var(--paper); }
.btn:active { transform: translate(2px, 2px); filter: drop-shadow(2px 2px 0 var(--ink)); }
.btn.primary:active { filter: drop-shadow(2px 2px 0 var(--gray)); }
.btn.sm .bi { min-height: 40px; font-size: 13px; padding: 0 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; margin-right: 4px; }
.link { display: block; margin: 20px auto 0; min-height: 44px; padding: 0 12px; font: 700 13px/44px var(--pixel); text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-align: center; }

/* segmented control */
.seg { filter: drop-shadow(4px 4px 0 var(--ink)); margin-right: 4px; }
.seg .bi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--ink); }
.seg button { min-height: 44px; background: var(--paper); font: 700 14px/1 var(--pixel); text-transform: uppercase; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--rose); }
.seg button:active { background: var(--mid); }

/* fields */
.lbl { display: block; font: 700 13px/1 var(--pixel); text-transform: uppercase; color: var(--dim); margin: 20px 0 8px; }
.lbl.first { margin-top: 0; }
.field { filter: drop-shadow(4px 4px 0 var(--ink)); margin-right: 4px; }
.field .bi { display: flex; }
.field:focus-within .bi { box-shadow: inset 0 0 0 2px var(--ink); }
.field input, .field textarea { width: 100%; min-height: 44px; border: 0; background: transparent; padding: 8px 12px; font: 22px/1.1 var(--term); outline: none; appearance: none; -webkit-appearance: none; border-radius: 0; }
.field textarea { min-height: 72px; resize: none; display: block; }
.field input::placeholder, .field textarea::placeholder { color: var(--gray); }
.shake { animation: shake .36s steps(4); }
@keyframes shake { 0%, 50% { transform: translateX(-4px); } 25%, 75% { transform: translateX(4px); } 100% { transform: none; } }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.chip { max-width: calc(100% - 4px); filter: drop-shadow(2px 2px 0 var(--ink)); transition: transform .1s steps(1); }
.chip .bi { background: var(--mid); min-height: 40px; padding: 0 12px; font: 22px/40px var(--term); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.on .bi { background: var(--rose); }
.chip:active { transform: translate(2px, 2px); }
.chip.new { filter: none; }
.chip.new .bo { background: none; padding: 0; }
.chip.new .bi { background: var(--paper); border: 2px dashed var(--ink); min-height: 44px; font: 700 13px/40px var(--pixel); }
.pickup { margin-top: 16px; font: 700 13px/1.5 var(--pixel); text-transform: uppercase; min-height: 20px; }
.pickup b { background: var(--rose); padding: 0 4px; }
.mt { margin-top: 22px; margin-right: 4px; }

/* scene */
.scene { position: relative; height: 120px; border-bottom: 2px solid var(--ink); margin: 0 0 20px; }
.mouse { position: absolute; left: 28px; bottom: 0; width: 96px; height: 96px; }
.mouse.bob { animation: bob 1s steps(1) infinite; }
.mouse.hop { animation: hop .5s steps(1) infinite; }
@keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes hop { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.cactus { position: absolute; right: 12px; bottom: 0; width: 32px; height: 48px; }
.zz { position: absolute; left: 128px; top: 4px; font: 700 13px/1 var(--pixel); }
.zz span { position: absolute; animation: blink 1.6s steps(1) infinite; }
.zz span:nth-child(1) { left: 0; top: 20px; }
.zz span:nth-child(2) { left: 14px; top: 4px; animation-delay: .8s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
.spark { position: absolute; width: 28px; height: 28px; animation: blink .5s steps(1) infinite; }
.spark.a { left: 0; top: 8px; }
.spark.b { left: 132px; top: 0; animation-delay: .25s; }
.scene-cap { position: absolute; left: 132px; bottom: 10px; font: 700 13px/1.3 var(--pixel); text-transform: uppercase; }

/* now reading */
.now-title { font: 32px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }
.meta { font: 22px/1.1 var(--term); color: var(--dim); text-transform: uppercase; margin-top: 4px; }

/* CRT */
.crt { filter: drop-shadow(4px 4px 0 var(--gray)); margin: 20px 4px 24px 0; }
.crt .bi {
  background-color: var(--ink);
  background-image: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px);
  color: var(--rose); padding: 12px 14px;
}
.crt-top, .crt-bot { display: flex; justify-content: space-between; gap: 8px; font: 700 13px/1 var(--pixel); color: var(--label); text-transform: uppercase; }
.crt-bot { justify-content: center; margin-top: 4px; }
.crt-digits { font: 96px/1 var(--term); text-align: center; margin: 10px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.crt-digits.long { font-size: 80px; }
.crt-digits.sm { font-size: 56px; margin: 8px 0 0; }
.rec { color: var(--rose); animation: blink 1.2s steps(1) infinite; }

/* pages */
.pages { display: grid; grid-template-columns: 1fr 30px 1fr; align-items: end; gap: 0 8px; }
.pages .arrow { padding-bottom: 16px; display: flex; justify-content: center; }
.pages-sum { margin-top: 16px; font: 24px/1 var(--term); text-transform: uppercase; }
.pages-sum.err { background: var(--ink); color: var(--rose); padding: 4px 8px; display: inline-block; }
.mat { font: 30px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }

/* log rows */
.row { display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 48px; padding: 12px 0; border-bottom: 2px dotted var(--gray); font: 22px/1.1 var(--term); }
.rows > :last-child { border-bottom: 0; }
.row:active { background: var(--mid); }
.row .t, .row .pg { color: var(--dim); white-space: nowrap; flex: none; }
.row .name { text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.row .lead { flex: 1 1 12px; min-width: 12px; border-bottom: 2px dotted var(--ink); transform: translateY(-6px); }
.row .min { white-space: nowrap; flex: none; }
.row-note { display: block; color: var(--dim); font-size: 20px; padding: 0 0 12px; margin-top: -6px; border-bottom: 2px dotted var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.has-note { border-bottom: 0; }
.empty { padding: 4px 0; color: var(--dim); font: 22px/1.2 var(--term); text-transform: uppercase; }
.flush .rows { padding: 0 16px; }
.flush .empty { padding: 16px; }

/* history */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wbox { width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 2px 2px 0 var(--ink); }
.wbox.hit { background: var(--rose); }
.wbox.part { background-color: var(--paper); background-image: conic-gradient(var(--rose) 25%, var(--paper) 0 50%, var(--rose) 0 75%, var(--paper) 0); background-size: 8px 8px; }
.wl { font: 700 13px/18px var(--pixel); width: 22px; text-align: center; }
.wl.today { background: var(--ink); color: var(--rose); }
.stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-top: 18px; padding-top: 14px; border-top: 2px dotted var(--gray); font: 24px/1.1 var(--term); text-transform: uppercase; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font: 700 11px/14px var(--pixel); text-transform: uppercase; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border: 2px solid var(--ink); display: inline-block; background: var(--paper); }
.legend i.hit { background: var(--rose); }
.legend i.part { background-image: conic-gradient(var(--rose) 25%, var(--paper) 0 50%, var(--rose) 0 75%, var(--paper) 0); background-size: 4px 4px; }
.dayhdr { display: flex; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--paper); padding: 6px 16px; font: 22px/1 var(--term); text-transform: uppercase; }
.dayhdr b { color: var(--rose); font-weight: 400; white-space: nowrap; }
.carried { padding: 10px 16px; color: var(--dim); font: 20px/1.1 var(--term); text-transform: uppercase; }

/* books */
.addbook { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.addbook .btn { width: auto; }
.brow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 2px dotted var(--gray); }
.brow:last-child { border-bottom: 0; }
.brow-main { flex: 1; min-width: 0; }
.brow-title { font: 26px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }
.brow.archived .brow-title { color: var(--dim); }
.brow .btn { width: auto; flex: none; margin-right: 4px; }

/* stepper */
.stepper { display: grid; grid-template-columns: 48px 48px 1fr 48px 48px; gap: 10px; align-items: center; margin-right: 4px; }
.stepper .btn .bi { padding: 0; font-size: 13px; min-height: 44px; }
.stepper .field { margin-right: 0; }
.stepper input { text-align: center; font-size: 28px; }
.note { margin-top: 20px; padding: 12px; background: var(--ink); color: var(--paper); font: 22px/1.15 var(--term); }
.note b { color: var(--rose); font-weight: 400; }
.small { font: 20px/1.2 var(--term); color: var(--dim); margin-top: 12px; text-transform: uppercase; }

/* modal */
.ov {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
  background-image: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0); background-size: 4px 4px;
  padding: calc(var(--st) + 12px) calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px);
}
.ov > div { width: 100%; max-width: 520px; max-height: calc(100dvh - var(--st) - var(--sb) - 24px); display: flex; }
.ov .win { width: 100%; margin: 0 4px 4px 0; display: flex; }
.ov .win > .bo { width: 100%; display: flex; }
.ov .win > .bo > .bi { width: 100%; display: flex; flex-direction: column; min-height: 0; }
.ov .wb { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 2px solid var(--ink); padding: 0 var(--sr) var(--sb) var(--sl); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 520px; margin: 0 auto; height: var(--tab-h); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 700 13px/1 var(--pixel); text-transform: uppercase; position: relative; }
.tab + .tab { border-left: 2px solid var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--rose); }
.tab .live { position: absolute; top: 10px; right: calc(50% - 22px); width: 8px; height: 8px; background: var(--rose); border: 2px solid var(--ink); box-sizing: content-box; animation: blink 1.2s steps(1) infinite; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + var(--tab-h) + 22px); z-index: 50; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 40px); pointer-events: none; filter: drop-shadow(4px 4px 0 var(--gray)); visibility: hidden; }
.toast .bi { background: var(--ink); color: var(--paper); padding: 10px 14px; font: 700 13px/1.4 var(--pixel); text-transform: uppercase; text-align: center; }
.toast.show { visibility: visible; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo"><span class="logo-sq" aria-hidden="true"></span><span class="logo-txt">READ.LOG</span></div>
    <div class="date" id="date"></div>
  </header>
  <main>
    <div id="view-today">
      <div id="home"></div>
      <div id="todayLog"></div>
    </div>
    <div id="view-history" hidden></div>
    <div id="view-books" hidden></div>
  </main>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabs" role="tablist" id="tabs"></div>
</nav>
<div class="ov" id="ov" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><div class="bo"><div class="bi" id="toastText"></div></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/*CORE-START*/
// Pure, DOM-free logic. Everything time-related takes `now` explicitly so it can be tested.
(function (root) {
  'use strict';
  const SCHEMA = 1;
  const KEY = 'readinglog.data';
  const TIMER_KEY = 'readinglog.timer';
  const TYPES = ['book', 'article', 'poem'];
  const MIN = 60000;

  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ----- dates (local time) -----
  function dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function parseDay(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(key, n) {
    const d = parseDay(key);
    d.setDate(d.getDate() + n);
    return dayKey(d.getTime());
  }
  function nextMidnight(ts) {
    const d = new Date(ts);
    d.setHours(24, 0, 0, 0); // DST-safe: lets the Date object handle 23/25h days
    return d.getTime();
  }
  // Split the interval [a, b) into milliseconds per local day.
  function splitByDay(a, b, out) {
    out = out || {};
    let t = a;
    while (t < b) {
      const m = Math.min(nextMidnight(t), b);
      const k = dayKey(t);
      out[k] = (out[k] || 0) + (m - t);
      t = m;
    }
    return out;
  }

  // ----- timer (timestamp based) -----
  // { status: 'idle'|'running'|'paused', segments: [{start,end}], runStart: ts|null, material?: {type,title,fromPage} }
  // 'paused' is the STOPPED state: the chunk is over and waiting to be saved or discarded.
  const idleTimer = () => ({ status: 'idle', segments: [], runStart: null });
  function start(t, now, material) {
    if (t.status === 'running') return t;
    const out = { status: 'running', segments: t.segments.slice(), runStart: now };
    const m = material || t.material;
    if (m) out.material = m;
    return out;
  }
  function pause(t, now) {
    if (t.status !== 'running') return t;
    const end = Math.max(now, t.runStart); // guard against the clock going backwards
    const segments = t.segments.concat(end > t.runStart ? [{ start: t.runStart, end }] : []);
    const out = { status: 'paused', segments, runStart: null };
    if (t.material) out.material = t.material;
    return out;
  }
  const stop = pause;
  function segmentsAt(t, now) {
    if (t.status !== 'running') return t.segments;
    return t.segments.concat([{ start: t.runStart, end: Math.max(now, t.runStart) }]);
  }
  function elapsed(t, now) {
    return segmentsAt(t, now).reduce((s, g) => s + (g.end - g.start), 0);
  }
  function timerAlloc(t, now) {
    const out = {};
    for (const g of segmentsAt(t, now)) splitByDay(g.start, g.end, out);
    return out;
  }
  // What gets saved when you stop a chunk.
  function draftFromTimer(t, now) {
    const segs = segmentsAt(t, now);
    return {
      durationMs: elapsed(t, now),
      alloc: timerAlloc(t, now),
      startedAt: segs.length ? segs[0].start : now,
      endedAt: segs.length ? segs[segs.length - 1].end : now,
    };
  }

  // Rescale a per-day allocation to a new total (when you edit the time).
  function scaleAlloc(alloc, ms, fallbackDay) {
    const keys = Object.keys(alloc || {}).filter((k) => alloc[k] > 0).sort();
    const total = keys.reduce((s, k) => s + alloc[k], 0);
    if (!keys.length || total <= 0) return { [fallbackDay]: ms };
    const out = {};
    let acc = 0;
    keys.forEach((k, i) => {
      const v = i === keys.length - 1 ? Math.max(0, ms - acc) : Math.round((alloc[k] * ms) / total);
      out[k] = v;
      acc += v;
    });
    return out;
  }

  // The last end page you logged for a book (by most recent session), ignoring `excludeId`.
  function lastEndPage(sessions, bookId, excludeId) {
    let best = null;
    for (const s of sessions) {
      if (s.id === excludeId || s.type !== 'book' || s.bookId !== bookId) continue;

  const MOUSE = [
    '..KKKKKK......KKKKKK....',
    '.KPPPPPPK....KPPPPPPK...',
    'KPPPPPPPPK..KPPPPPPPPK..',
    'KPPPPPPPPK..KPPPPPPPPK..',
    'KPPPPPPPPK..KPPPPPPPPK..',
    'KPPPPPPPPKKKKPPPPPPPPK..',
    '.KKPPPPPKGGGGKPPPPPKK...',
    '...KKKKKKGGGGKKKKKK.....',
    '...KGGGGGGGGGGGGGGK.....',
    '...KGGGKGGGGGGKGGGK.....',
    '...KGGGGGGGGGGGGGGK.....',
    '...KGGGGGPPPPGGGGGKKKK..',
    '...KGGGGGGPPGGGGGGKKPKK.',
    '....KKGGGGGGGGGGKK.KKPK.',
    '.....KGGGGGGGGGGK...KPK.',
    '....KGGGGGGGGGGGGK..KPK.',
    '....KGGGGGPPGGGGGK..KPK.',

    '....KGGPGGGGGGPGGK..KPK.',
    '....KGGGGGGGGGGGGK.KKPK.',
    '....KGGGGGGGGGGGGKKKPKK.',

  const MOODS = {

  const num = (v) => (v === null || v === undefined || v === '' ? null : Number.isFinite(Number(v)) ? Number(v) : null);

  function migrate(obj) {

    if (!obj.schema) obj.schema = 1;
    if (obj.schema > SCHEMA) throw new Error(`This backup is from a newer version (schema ${obj.schema}).`);
    return obj;
  }
  function sanitize(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Not a reading log backup.');
    obj = migrate(obj);
    const data = freshData();
    const st = obj.settings || {};
    const g = num(st.goalMin);
    data.settings.goalMin = g && g >= 1 && g <= 1440 ? Math.round(g) : 60;
    data.settings.lastExport = num(st.lastExport);
    const seenBooks = new Set();
    for (const b of Array.isArray(obj.books) ? obj.books : []) {
      if (!b || typeof b.title !== 'string' || !b.title.trim()) continue;
      const id = typeof b.id === 'string' && b.id ? b.id : uid();
      if (seenBooks.has(id)) continue;

<script>
(function () {

    else $('#home').innerHTML = win('SAVE_SESSION', saveHTML());
    $('#todayLog').hidden = st === 'save';
    if (st === 'ready') { updateChips(); updatePickup(); }
    if (st === 'save') updatePagesSum();
    renderTodayLog();
  }

  function readyHTML() {
    const d = ui.draft;
    return `<div class="scene" id="scene"></div>
      ${seg(d.type, 'dtype')}
      <label class="lbl" for="fMat">Material</label>
      ${field(`<input id="fMat" value="${esc(d.title)}" placeholder="${d.type === 'book' ? 'Which book?' : d.type === 'article' ? 'Article title' : 'Poem title'}" autocomplete="off" autocapitalize="words" enterkeyhint="go">`, 'id="matField"')}
      <div class="chips" id="chips"></div>
      <div class="pickup" id="pickup"></div>
      <div class="mt">${btn(icon('play', 2) + 'Start', 'start', 'primary')}</div>`;
  }
  function updateChips() {
    const d = ui.draft;
    const q = C.normTitle(d.title);
    let items = d.type === 'book' ? activeBooks().map((b) => b.title) : C.recentTitles(data.sessions, d.type, 8);
    if (q && !items.some((t) => C.normTitle(t) === q)) items = items.filter((t) => C.normTitle(t).includes(q));
    $('#chips').innerHTML = items.slice(0, 8).map((t) => chip(esc(t), 'chip', C.normTitle(t) === q, `data-title="${esc(t)}"`)).join('') +
      chip('+ New', 'newmat', false, '', 'new');
  }
  function updatePickup() {
    const d = ui.draft;
    let html = '';
    if (d.type === 'book' && C.normTitle(d.title)) {
      const last = C.prefillStartPage(data, d.title);
      if (last !== null) html = `Pick up at <b>p.${last}</b>`;
      else if (!C.findBook(data, d.title)) html = 'New book · goes on your shelf';
    }
    $('#pickup').innerHTML = html;
  }

  function runningHTML() {
    const m = timer.material || { type: ui.draft.type, title: '' };
    const meta = [TYPE_LABEL[m.type]];
    if (m.type === 'book' && Number.isFinite(m.fromPage)) meta.push(`FROM p.${m.fromPage}`);
    const n = C.sessionNumber(data.sessions, today());
    return `<div class="scene" id="scene"></div>
      <div class="lbl first">Now reading</div>
      <div class="now-title">${esc(m.title || 'Untitled')}</div>
      <div class="meta">${esc(meta.join(' · '))}</div>
      <div class="crt"><div class="bo"><div class="bi">
        <div class="crt-top"><span>Session ${pad(n)}</span><span>[ <span class="rec">REC</span> ]</span></div>
        <div class="crt-digits" id="crt" role="timer">00:00</div>
        <div class="crt-bot">counting up</div>
      </div></div></div>
      ${btn(icon('stop', 2) + 'Stop', 'stop', 'dark')}`;
  }

  // The STOPPED chunk's form. Kept in storage so closing the app mid-save loses nothing.
  function saveMaterial() {
    return timer.material || { type: (ui.save && ui.save.type) || ui.draft.type, title: '' };
  }
  function ensureSaveForm() {
    const key = timer.segments.length ? timer.segments[0].start : 0;
    if (ui.save && ui.save.key === key) return ui.save;
    const stored = jget(SAVEFORM_KEY);
    if (stored && stored.key === key) { ui.save = stored; return ui.save; }
    const m = timer.material;
    ui.save = { key, startPage: m && m.type === 'book' ? C.prefillStartPage(data, m.title) : null, endPage: null, note: '', startTouched: false, title: '', type: ui.draft.type };
    return ui.save;
  }
  const persistSaveForm = () => sset(SAVEFORM_KEY, JSON.stringify(ui.save));

  function saveHTML() {
    const s = ensureSaveForm();
    const m = saveMaterial();
    const ms = C.elapsed(timer, Date.now());
    const v = (x) => (Number.isFinite(x) ? x : '');
    const type = m.title ? m.type : s.type;
    let html = `<div class="crt" style="margin-top:0"><div class="bo"><div class="bi">
        <div class="crt-top"><span>Time read</span><span>[ stopped ]</span></div>
        <div class="crt-digits sm">${C.fmtHMS(ms)}</div></div></div></div>`;
    if (m.title) {
      html += `<div class="lbl">Material</div><div class="mat">${esc(m.title)}</div><div class="meta">${TYPE_LABEL[m.type]}</div>`;
    } else {
      html += `${seg(s.type, 'stype')}<label class="lbl" for="sTitle">Material</label>
        ${field(`<input id="sTitle" value="${esc(s.title)}" placeholder="What did you read?" autocomplete="off" autocapitalize="words">`, 'id="sTitleField"')}`;
    }
    if (type === 'book') {
      html += `<div class="pages">
          <div><label class="lbl" for="sStart">Start page</label>${field(`<input id="sStart" inputmode="numeric" pattern="[0-9]*" value="${v(s.startPage)}" placeholder="—">`)}</div>
          <div class="arrow">${icon('arrow', 2)}</div>
          <div><label class="lbl" for="sEnd">End page</label>${field(`<input id="sEnd" inputmode="numeric" pattern="[0-9]*" value="${v(s.endPage)}" placeholder="—">`)}</div>
        </div>
        <div class="pages-sum" id="pagesSum"></div>`;
    }
    html += `<label class="lbl" for="sNote">Note (optional)</label>
      ${field(`<textarea id="sNote" rows="2" placeholder="A line you loved…">${esc(s.note)}</textarea>`)}
      <div class="btn-row">${btn('Discard', 'discard', '')}${btn('Save', 'save', 'primary')}</div>`;
    return html;
  }
  const readPage = (id) => {
    const el = $(id);
    if (!el || el.value.trim() === '') return null;
    const n = parseInt(el.value, 10);
    return Number.isFinite(n) && n >= 0 ? n : null;
  };
  function pagesSumText(startPage, endPage) {
    if (Number.isFinite(startPage) && Number.isFinite(endPage) && endPage < startPage) return ['End page is before start', true];
    const pr = C.pagesRead(startPage, endPage);
    return [`= ${pr === null ? '?' : pr} page${pr === 1 ? '' : 's'} this session`, false];
  }
  function updatePagesSum() {
    const el = $('#pagesSum');
    if (!el) return;
    const s = ui.save;
    s.startPage = readPage('#sStart'); s.endPage = readPage('#sEnd');
    const [txt, bad] = pagesSumText(s.startPage, s.endPage);
    el.textContent = txt; el.classList.toggle('err', bad);
  }

  function rowHTML(s, withTime) {
    const pg = pagesText(s);
    return `<button class="row ${s.note && !withTime ? 'has-note' : ''}" data-action="edit" data-id="${esc(s.id)}">${withTime ? `<span class="t">${hhmm(s.startedAt)}</span>` : ''}<span class="name">${esc(bookTitle(s))}</span>${pg ? `<span class="pg">${pg}</span>` : ''}<span class="lead"></span><span class="min">${C.fmtDur(s.durationMs)}</span></button>` +
      (s.note && !withTime ? `<span class="row-note">“${esc(s.note)}”</span>` : '');
  }
  function renderTodayLog() {
    const k = today();
    const list = data.sessions.filter((s) => C.sessionDay(s) === k).sort((a, b) => a.startedAt - b.startedAt);
    $('#todayLog').innerHTML = win('TODAY\'S LOG', list.length ? `<div class="rows">${list.map((s) => rowHTML(s, true)).join('')}</div>` : '<div class="empty">Nothing yet today.<br>Your book misses you.</div>', { titleId: 'logTitle' });
    updateLogTitle();
  }
  function updateLogTitle() {
    const el = $('#logTitle');
    if (!el) return;
    const total = C.todayTotal(data, timer, Date.now());
    const txt = `TODAY'S LOG · ${Math.floor(total / C.MIN)}/${data.settings.goalMin} MIN`;
    if (el.textContent !== txt) el.textContent = txt;
  }

  function tick() {
    const now = Date.now();
    if (C.dayKey(now) !== ui.lastDay) { renderAll(); return; }
    if (ui.tab === 'today') {
      maybeCheer();
      updateScene();
      const crt = $('#crt');
      if (crt) {
        const ms = C.elapsed(timer, now);
        const txt = C.fmtCRT(ms);
        if (crt.textContent !== txt) crt.textContent = txt;
        crt.classList.toggle('long', ms >= 3600000);
      }
      updateLogTitle();
    }
    const dot = $('#liveDot');
    if (dot) dot.hidden = !(timer.status === 'running' && ui.tab !== 'today');
  }

  // ---------- HISTORY ----------
  function dayLabel(key) {
    const t = today();
    if (key === t) return 'Today';
    if (key === C.addDays(t, -1)) return 'Yesterday';
    const d = C.parseDay(key);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', ...(d.getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' }) }).replace(/,/g, '');
  }
  function renderHistory() {
    const now = Date.now();
    const t = C.dayKey(now);
    const g = goalMs();
    const totals = C.dayTotals(data.sessions, C.timerAlloc(timer, now));
    const n = C.streak(totals, t, g);
    const wk = C.week(totals, t, g);
    const weekMs = wk.reduce((s, d) => s + d.ms, 0);
    const boxes = wk.map((d) => {
      const letter = C.parseDay(d.key).toLocaleDateString('en-US', { weekday: 'narrow' });
      const cls = d.hit ? 'hit' : d.ms > 0 ? 'part' : '';
      return `<div class="wd"><div class="wbox ${cls}" role="img" aria-label="${esc(dayLabel(d.key))}: ${C.fmtDur(d.ms)}${d.hit ? ', goal hit' : ''}"></div><span class="wl ${d.today ? 'today' : ''}">${letter}</span></div>`;
    }).join('');
    let html = win('THIS_WEEK', `<div class="week">${boxes}</div>
      <div class="stats"><span>Streak: ${n} day${n === 1 ? '' : 's'}</span><span>Week: ${C.fmtDur(weekMs)}</span></div>
      <div class="legend"><span><i class="hit"></i>Goal hit</span><span><i class="part"></i>Partial</span><span><i></i>Missed</span></div>`);

    const saved = C.dayTotals(data.sessions);
    const days = Object.keys(saved).sort().reverse();
    const byDay = {};
    for (const s of data.sessions) (byDay[C.sessionDay(s)] ||= []).push(s);
    let log = '';
    for (const k of days) {
      const list = (byDay[k] || []).sort((a, b) => b.startedAt - a.startedAt);
      log += `<div class="dayhdr"><span>${esc(dayLabel(k))}</span><b>${C.fmtDur(saved[k])}</b></div>`;
      log += list.length ? `<div class="rows">${list.map((s) => rowHTML(s, false)).join('')}</div>` : '<div class="carried">Time from a session that ran past midnight</div>';
    }
    html += win('LOG.TXT', log || '<div class="empty">No entries yet. Your days will stack up here.</div>', { flush: true });
    $('#view-history').innerHTML = html;
  }

  // ---------- BOOKS & PREFS ----------
  function renderBooks() {
    const stats = C.bookStats(data);
    const active = activeBooks();
    const archived = data.books.filter((b) => b.archived).sort((a, b) => stats[b.id].lastReadAt - stats[a.id].lastReadAt);
    const row = (b) => {
      const s = stats[b.id];
      const meta = [C.fmtDur(s.totalMs)];
      if (s.lastPage !== null) meta.push(`last p.${s.lastPage}`);
      meta.push(`${s.count} session${s.count === 1 ? '' : 's'}`);
      return `<div class="brow ${b.archived ? 'archived' : ''}"><div class="brow-main"><div class="brow-title">${esc(b.title)}</div><div class="meta">${esc(meta.join(' · '))}</div></div>
        ${btn(b.archived ? 'Restore' : 'Archive', b.archived ? 'unarchive' : 'archive', 'sm', `data-id="${esc(b.id)}"`)}</div>`;
    };
    let shelf = `<form class="addbook" id="addBookForm" autocomplete="off">
        ${field('<input id="newBook" placeholder="Add a book…" aria-label="Book title" enterkeyhint="done" autocapitalize="words">')}
        <button class="btn primary" type="submit"><span class="bo"><span class="bi">Add</span></span></button>
      </form>`;
    shelf += active.length ? `<div style="margin-top:12px">${active.map(row).join('')}</div>` : '<div class="empty" style="margin-top:16px">Shelf is empty. Add a book, or log one and it lands here.</div>';
    if (archived.length) {
      shelf += `<button class="link" data-action="toggle-archived">${ui.archivedOpen ? 'Hide' : 'Show'} archived (${archived.length})</button>`;
      if (ui.archivedOpen) shelf += archived.map(row).join('');
    }
    const last = data.settings.lastExport;
    const ago = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const lastTxt = last === null ? 'No backup yet' : ago === 0 ? 'Last backup: today' : `Last backup: ${ago} day${ago === 1 ? '' : 's'} ago`;
    const prefs = `<label class="lbl first" for="gGoal">Daily goal (minutes)</label>
      <div class="stepper">
        ${btn('-15', 'goal', '', 'data-d="-15" aria-label="Minus 15 minutes"')}${btn('-5', 'goal', '', 'data-d="-5" aria-label="Minus 5 minutes"')}
        ${field(`<input id="gGoal" inputmode="numeric" pattern="[0-9]*" value="${data.settings.goalMin}">`)}
        ${btn('+5', 'goal', '', 'data-d="5" aria-label="Plus 5 minutes"')}${btn('+15', 'goal', '', 'data-d="15" aria-label="Plus 15 minutes"')}
      </div>
      <div class="btn-row">${btn('Export', 'export', 'dark')}${btn('Import', 'import', '')}</div>
      <div class="small">${esc(lastTxt)} · ${data.sessions.length} session${data.sessions.length === 1 ? '' : 's'}</div>
      <div class="note">Data lives <b>only on this phone</b>. Export a backup now and then — save it to Files or iCloud Drive. Import replaces everything.</div>`;
    $('#view-books').innerHTML = win('SHELF.DB', shelf) + win(`${icon('gear', 2)}PREFS.CFG`, prefs);
  }
  function setGoal(min) {
    data.settings.goalMin = Math.max(5, Math.min(600, Math.round(min) || 60));
    persist();
    const el = $('#gGoal');
    if (el && document.activeElement !== el) el.value = data.settings.goalMin;
  }
  async function exportData() {
    const now = Date.now();
    const json = C.exportJSON(data, now);
    const name = `reading-log-backup-${C.dayKey(now)}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    let done = false;
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Reading log backup' });
        done = true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // closed the share sheet
    }
    if (!done) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    data.settings.lastExport = now;
    persist(); renderBooks();
    toast('Backup ready');
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let next;
      try { next = C.importJSON(String(reader.result)); } catch (e) { toast(e.message); return; }
      if (!confirm(`Replace everything with this backup?\n\n${next.sessions.length} sessions, ${next.books.length} books.\nYour current data (${data.sessions.length} sessions) will be replaced.`)) return;
      data = next; persist(); renderAll();
      toast('Backup restored');
    };
    reader.onerror = () => toast('Couldn’t read that file');
    reader.readAsText(file);
  }

  // ---------- EDIT (from a log row) ----------
  function openEdit(id) {
    const s = data.sessions.find((x) => x.id === id);
    if (!s) return;
    ui.edit = { id, type: s.type, title: bookTitle(s), startPage: s.startPage, endPage: s.endPage, note: s.note, durMs: s.durationMs, origDur: s.durationMs };
    renderEdit();
    $('#ov').hidden = false;
    document.body.classList.add('locked');
  }
  function closeEdit() {
    $('#ov').hidden = true; ui.edit = null;
    document.body.classList.remove('locked');
  }
  function renderEdit() {
    const e = ui.edit;
    const v = (x) => (Number.isFinite(x) ? x : '');
    const body = `${seg(e.type, 'etype')}
      <label class="lbl" for="eTitle">Title</label>
      ${field(`<input id="eTitle" value="${esc(e.title)}" autocomplete="off" autocapitalize="words">`, 'id="eTitleField"')}
      ${e.type === 'book' ? `<div class="pages">
          <div><label class="lbl" for="eStart">Start page</label>${field(`<input id="eStart" inputmode="numeric" pattern="[0-9]*" value="${v(e.startPage)}" placeholder="—">`)}</div>
          <div class="arrow">${icon('arrow', 2)}</div>
          <div><label class="lbl" for="eEnd">End page</label>${field(`<input id="eEnd" inputmode="numeric" pattern="[0-9]*" value="${v(e.endPage)}" placeholder="—">`)}</div>
        </div><div class="pages-sum" id="eSum"></div>` : ''}
      <label class="lbl" for="eMin">Minutes</label>
      <div class="stepper">
        ${btn('-5', 'edur', '', 'data-d="-5" aria-label="Minus 5 minutes"')}${btn('-1', 'edur', '', 'data-d="-1" aria-label="Minus 1 minute"')}
        ${field(`<input id="eMin" inputmode="numeric" pattern="[0-9]*" value="${Math.round(e.durMs / C.MIN)}">`)}
        ${btn('+1', 'edur', '', 'data-d="1" aria-label="Plus 1 minute"')}${btn('+5', 'edur', '', 'data-d="5" aria-label="Plus 5 minutes"')}
      </div>
      <label class="lbl" for="eNote">Note</label>
      ${field(`<textarea id="eNote" rows="2">${esc(e.note)}</textarea>`)}
      <div class="btn-row">${btn('Cancel', 'close-edit', '')}${btn('Save', 'save-edit', 'primary')}</div>
      <button class="link" data-action="delete">Delete entry</button>`;
    $('#modal').innerHTML = win('EDIT_SESSION', body, { close: 'close-edit' });
    updateEditSum();
  }
  function updateEditSum() {
    const el = $('#eSum');
    if (!el) return;
    const e = ui.edit;
    e.startPage = readPage('#eStart'); e.endPage = readPage('#eEnd');
    const [txt, bad] = pagesSumText(e.startPage, e.endPage);
    el.textContent = txt; el.classList.toggle('err', bad);
  }
  function captureEdit() {
    const e = ui.edit;
    e.title = $('#eTitle').value; e.note = $('#eNote').value;
    updateEditSum();
  }
  function saveEdit() {
    captureEdit();
    const e = ui.edit;
    const title = e.title.trim();
    if (!title) { shake($('#eTitleField')); toast('Give it a title'); return; }
    if (!(e.durMs > 0)) { toast('Add at least a minute'); return; }
    if (e.type === 'book' && Number.isFinite(e.startPage) && Number.isFinite(e.endPage) && e.endPage < e.startPage) { toast('End page is before start'); return; }
    const s = data.sessions.find((x) => x.id === e.id);
    if (!s) { closeEdit(); return; }
    const book = e.type === 'book' ? C.upsertBook(data, title, Date.now()) : null;
    Object.assign(s, {
      type: e.type, title: book ? book.title : title, bookId: book ? book.id : null,
      startPage: book ? e.startPage : null, endPage: book ? e.endPage : null, note: e.note.trim(), durationMs: e.durMs,
    });
    if (e.durMs !== e.origDur) s.alloc = C.scaleAlloc(s.alloc, e.durMs, C.sessionDay(s));
    persist(); closeEdit(); renderAll();
    toast('Updated');
  }

  // ---------- actions ----------
  function startReading() {
    const d = ui.draft;
    d.title = $('#fMat').value.trim();
    if (!d.title) { shake($('#matField')); toast('Name what you’re reading'); $('#fMat').focus(); return; }
    persistDraft();
    const book = d.type === 'book' ? C.findBook(data, d.title) : null;
    const material = { type: d.type, title: book ? book.title : d.title, fromPage: d.type === 'book' ? C.prefillStartPage(data, d.title) : null };
    if (document.activeElement) document.activeElement.blur();
    timer = C.start(C.idleTimer(), Date.now(), material);
    persistTimer();
    renderHome(); tick();
  }
  function stopReading() {
    timer = C.stop(timer, Date.now());
    persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    renderHome(); tick();
    window.scrollTo(0, 0);
  }
  function captureSave() {
    const s = ui.save;
    if (!s) return;
    if ($('#sTitle')) s.title = $('#sTitle').value;
    if ($('#sNote')) s.note = $('#sNote').value;
    updatePagesSum();
    persistSaveForm();
  }
  function saveSession() {
    captureSave();
    const s = ui.save;
    const m = saveMaterial();
    const type = m.title ? m.type : s.type;
    const title = (m.title || s.title).trim();
    if (!title) { shake($('#sTitleField')); toast('Give it a title'); return; }
    const now = Date.now();
    const d = C.draftFromTimer(timer, now);
    if (!(d.durationMs > 0)) { toast('Nothing timed — discard it'); return; }
    if (type === 'book' && Number.isFinite(s.startPage) && Number.isFinite(s.endPage) && s.endPage < s.startPage) { shake($('#pagesSum')); toast('End page is before start'); return; }
    const book = type === 'book' ? C.upsertBook(data, title, now) : null;
    data.sessions.push({
      id: C.uid(), type, title: book ? book.title : title, bookId: book ? book.id : null,
      startPage: book ? s.startPage : null, endPage: book ? s.endPage : null, note: s.note.trim(),
      durationMs: d.durationMs, alloc: d.alloc, startedAt: d.startedAt, endedAt: d.endedAt,
    });
    persist();
    timer = C.idleTimer(); persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    ui.draft = { type, title: book ? book.title : title }; persistDraft();
    renderAll();
    window.scrollTo(0, 0);
    toast('Saved to log');
  }
  function discardSession() {
    if (!confirm('Discard this session? The time won’t be logged.')) return;
    timer = C.idleTimer(); persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    renderAll();
    toast('Discarded');
  }

  function renderAll() {
    ui.lastDay = today();
    renderHeader();
    for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab));
    for (const v of ['today', 'history', 'books']) $('#view-' + v).hidden = v !== ui.tab;
    if (ui.tab === 'today') renderHome();
    if (ui.tab === 'history') renderHistory();
    if (ui.tab === 'books') renderBooks();
    tick();
  }
  function setTab(tab) {
    if (ui.tab === 'today' && ui.homeState === 'save') captureSave();
    ui.tab = tab;
    renderAll();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action],[data-tab]');
    if (!el) return;
    if (el.dataset.tab) { setTab(el.dataset.tab); return; }
    switch (el.dataset.action) {
      case 'dtype':
        ui.draft.type = el.dataset.type; ui.draft.title = ''; persistDraft();
        renderHome(); tick(); break;
      case 'chip':
        ui.draft.title = el.dataset.title; $('#fMat').value = el.dataset.title; persistDraft();
        updateChips(); updatePickup(); break;
      case 'newmat':
        ui.draft.title = ''; $('#fMat').value = ''; persistDraft();
        updateChips(); updatePickup(); $('#fMat').focus(); break;
      case 'start': startReading(); break;
      case 'stop': stopReading(); break;
      case 'stype':
        captureSave(); ui.save.type = el.dataset.type; persistSaveForm(); renderHome(); break;
      case 'save': saveSession(); break;
      case 'discard': discardSession(); break;
      case 'edit': openEdit(el.dataset.id); break;
      case 'etype': captureEdit(); ui.edit.type = el.dataset.type; renderEdit(); break;
      case 'edur': {
        const ed = ui.edit;
        ed.durMs = Math.max(0, Math.round(ed.durMs / C.MIN) * C.MIN + Number(el.dataset.d) * C.MIN);
        $('#eMin').value = Math.round(ed.durMs / C.MIN);
        break;
      }
      case 'close-edit': closeEdit(); break;
      case 'save-edit': saveEdit(); break;
      case 'delete':
        if (confirm('Delete this entry? This can’t be undone.')) {
          data.sessions = data.sessions.filter((x) => x.id !== ui.edit.id);
          persist(); closeEdit(); renderAll(); toast('Deleted');
        }
        break;
      case 'goal': setGoal(data.settings.goalMin + Number(el.dataset.d)); break;
      case 'export': exportData(); break;
      case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
      case 'archive': case 'unarchive': {
        const b = data.books.find((x) => x.id === el.dataset.id);
        if (b) { b.archived = el.dataset.action === 'archive'; persist(); renderBooks(); toast(b.archived ? 'Archived' : 'Back on the shelf'); }
        break;
      }
      case 'toggle-archived': ui.archivedOpen = !ui.archivedOpen; renderBooks(); break;
    }
  });
  document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeEdit(); });

  document.addEventListener('input', (e) => {
    switch (e.target.id) {
      case 'fMat': ui.draft.title = e.target.value; persistDraft(); updateChips(); updatePickup(); break;
      case 'sTitle':
        ui.save.title = e.target.value;
        if (!ui.save.startTouched && ui.save.type === 'book' && $('#sStart')) {
          const p = C.prefillStartPage(data, e.target.value);
          $('#sStart').value = p === null ? '' : p;
        }
        updatePagesSum(); persistSaveForm(); break;
      case 'sStart': ui.save.startTouched = true; updatePagesSum(); persistSaveForm(); break;
      case 'sEnd': updatePagesSum(); persistSaveForm(); break;
      case 'sNote': ui.save.note = e.target.value; persistSaveForm(); break;
      case 'eStart': case 'eEnd': updateEditSum(); break;
      case 'eMin': { const n = parseInt(e.target.value, 10); ui.edit.durMs = Number.isFinite(n) && n >= 0 ? n * C.MIN : 0; break; }
      case 'gGoal': { const n = parseInt(e.target.value, 10); if (Number.isFinite(n) && n >= 5) setGoal(n); break; }
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'gGoal') { setGoal(parseInt(e.target.value, 10)); e.target.value = data.settings.goalMin; }
    if (e.target.id === 'importFile' && e.target.files[0]) importData(e.target.files[0]);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#ov').hidden) closeEdit();
    if (e.key === 'Enter' && e.target.id === 'fMat') { e.preventDefault(); startReading(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'addBookForm') return;
    e.preventDefault();
    const t = $('#newBook').value.trim();
    if (!t) { shake($('#newBook').closest('.field')); return; }
    const existed = C.findBook(data, t);
    C.upsertBook(data, t, Date.now());
    persist(); renderBooks();
    toast(existed ? 'Already on the shelf' : 'Shelved');
  });

  // Coming back to the app (after a lock / backgrounding): re-sync from storage & clock.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = C.loadTimer(storage);
    const changed = t.status !== timer.status;
    timer = t;
    if (changed) renderAll(); else tick();
  });
  window.addEventListener('storage', (e) => {
    if (e.key === C.KEY) { data = C.loadData(storage).data; renderAll(); }
    if (e.key === C.TIMER_KEY) { timer = C.loadTimer(storage); renderAll(); }
  });

  // ---------- boot ----------
  const loaded = C.loadData(storage);
  data = loaded.data;
  timer = C.loadTimer(storage);
  const dr = jget(DRAFT_KEY);
  ui.draft = dr && C.TYPES.includes(dr.type) ? { type: dr.type, title: typeof dr.title === 'string' ? dr.title : '' } : { type: 'book', title: '' };
  renderTabs();
  renderAll();
  if (loaded.warning) setTimeout(() => toast(loaded.warning), 600);
  setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 250);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
