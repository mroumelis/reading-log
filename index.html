    const ms = C.elapsed(timer, Date.now());
    const type = m.title ? m.type : s.type;
    let html = `<div class="crt" style="margin-top:0"><div class="bo"><div class="bi">
        <div class="crt-top"><span>Time read</span><span>[ stopped ]</span></div>
        <div class="crt-digits sm">${C.fmtHMS(ms)}</div></div></div></div>`;
    if (m.title) {
      html += `<div class="lbl">Material</div><div class="mat">${esc(m.title)}</div><div class="meta">${TYPE_LABEL[m.type]}</div>`;
    } else {
      html += `${seg(s.type, 'stype')}<label class="lbl" for="sTitle">Material</label>
        ${field(`<input id="sTitle" value="${esc(s.title)}" placeholder="What did you read?" autocomplete="off" autocapitalize="words">`, 'id="sTitleField"')}`;
    }
    if (type === 'book') html += pagesBlock('s', s.pages, s.override, 'this session');
    html += `<label class="lbl" for="sNote">Note (optional)</label>
      ${field(`<textarea id="sNote" rows="2" placeholder="A line you loved…">${esc(s.note)}</textarea>`)}
      <div class="btn-row">${btn('Discard', 'discard', '')}${btn('Save', 'save', 'primary')}</div>`;
    return html;
  }

  function rowHTML(s, withNote) {
    const pg = s.type === 'book' && s.pages ? `p.${C.prettyPages(s.pages)}` : '';
    const lead = s.manual ? '<span class="tag">Manual</span>' : `<span class="t">${hhmm(s.startedAt)}</span>`;
    const note = withNote && s.note;
    return `<button class="row ${note ? 'has-note' : ''}" data-action="edit" data-id="${esc(s.id)}">${lead}<span class="name">${esc(bookTitle(s))}</span><span class="lead"></span><span class="min">${C.fmtDur(s.durationMs)}</span>${pg ? `<span class="pg">${esc(pg)}${Number.isFinite(s.pagesOverride) ? ` · ${s.pagesOverride} pp` : ''}</span>` : ''}</button>` +
      (note ? `<span class="row-note">“${esc(s.note)}”</span>` : '');
  }
  function renderTodayLog() {
    const k = today(), h = dayHour();
    const list = C.displayOrder(data, data.sessions.filter((s) => C.sessionDay(s, h) === k));
    $('#todayLog').innerHTML = win('TODAY\'S LOG', list.length ? `<div class="rows">${list.map((s) => rowHTML(s, false)).join('')}</div>` : '<div class="empty">Nothing yet today.<br>Your book misses you.</div>', { titleId: 'logTitle' });
    updateLogTitle();
  }
  function updateLogTitle() {
    const el = $('#logTitle');
    if (!el) return;
    const total = C.todayTotal(data, timer, Date.now());
    const txt = `TODAY'S LOG · ${Math.floor(total / C.MIN)}/${data.settings.goalMin} MIN`;
    if (el.textContent !== txt) el.textContent = txt;
  }

  function tick() {
    const now = Date.now();
    if (today() !== ui.lastDay) { renderAll(); return; }
    if (ui.tab === 'today') {
      maybeCheer();
      updateScene();
      const crt = $('#crt');
      if (crt) {
        const ms = C.elapsed(timer, now);
        const txt = C.fmtCRT(ms);
        if (crt.textContent !== txt) crt.textContent = txt;
        crt.classList.toggle('long', ms >= 3600000);
      }
      updateLogTitle();
    }
    const dot = $('#liveDot');
    if (dot) dot.hidden = !(timer.status === 'running' && ui.tab !== 'today');
  }

  // ---------- HISTORY ----------
  function dayLabel(key) {
    const t = today();
    if (key === t) return 'Today';
    if (key === C.addDays(t, -1)) return 'Yesterday';
    const d = C.parseDay(key);
    return fmtDay(key, { weekday: 'short', month: 'short', day: 'numeric', ...(d.getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' }) });
  }
  function renderHistory() {
    const now = Date.now();
    const t = today(), h = dayHour();
    const g = goalMs();
    const totals = C.dayTotals(data, timer, now);
    const n = C.streak(totals, t, g);
    const wk = C.week(totals, t, g);
    const weekMs = wk.reduce((s, d) => s + d.ms, 0);
    const boxes = wk.map((d) => {
      const letter = C.parseDay(d.key).toLocaleDateString('en-US', { weekday: 'narrow' });
      const cls = d.hit ? 'hit' : d.ms > 0 ? 'part' : '';
      return `<div class="wd"><div class="wbox ${cls}" role="img" aria-label="${esc(dayLabel(d.key))}: ${C.fmtDur(d.ms)}${d.hit ? ', goal hit' : ''}"></div><span class="wl ${d.today ? 'today' : ''}">${letter}</span></div>`;
    }).join('');
    let html = win('THIS_WEEK', `<div class="mb">${btn('+ Add entry', 'add-entry', '')}</div>
      <div class="week">${boxes}</div>
      <div class="stats"><span>Streak: ${n} day${n === 1 ? '' : 's'}</span><span>Week: ${C.fmtDur(weekMs)}</span></div>
      <div class="legend"><span><i class="hit"></i>Goal hit</span><span><i class="part"></i>Partial</span><span><i></i>Missed</span></div>`);

    const saved = C.dayTotals(data);
    const days = Object.keys(saved).sort().reverse();
    const byDay = {};
    for (const s of data.sessions) (byDay[C.sessionDay(s, h)] ||= []).push(s);
    let log = '';
    for (const k of days) {
      log += `<div class="dayhdr"><span class="dh-date">${esc(dayLabel(k))}</span><b>${C.fmtDur(saved[k])}</b>
        <button class="dh-add" data-action="add-entry" data-date="${k}" aria-label="Add entry for ${esc(dayLabel(k))}"><span>${icon('plus', 2)}</span></button></div>`;
      log += `<div class="rows">${C.displayOrder(data, byDay[k] || []).map((s) => rowHTML(s, true)).join('')}</div>`;
    }
    html += win('LOG.TXT', log || '<div class="empty">No entries yet. Your days will stack up here.</div>', { flush: true });
    $('#view-history').innerHTML = html;
  }

  // ---------- BOOKS & PREFS ----------
  function renderBooks() {
    const stats = C.bookStats(data);
    const active = activeBooks();
    const archived = data.books.filter((b) => b.archived).sort((a, b) => stats[b.id].rank - stats[a.id].rank);
    const row = (b) => {
      const s = stats[b.id];
      const meta = [C.fmtDur(s.totalMs)];
      if (s.lastPage !== null) meta.push(`last p.${s.lastPage}`);
      if (s.pages) meta.push(`${s.pages} pages`);
      meta.push(`${s.count} entr${s.count === 1 ? 'y' : 'ies'}`);
      return `<div class="brow ${b.archived ? 'archived' : ''}"><div class="brow-main"><div class="brow-title">${esc(b.title)}</div>${b.author ? `<div class="meta">${esc(b.author)}</div>` : ''}<div class="meta">${esc(meta.join(' · '))}</div></div>
        ${btn(b.archived ? 'Restore' : 'Archive', b.archived ? 'unarchive' : 'archive', 'sm', `data-id="${esc(b.id)}"`)}</div>`;
    };
    let shelf = `<form class="addbook" id="addBookForm" autocomplete="off">
        ${field('<input id="newBook" placeholder="Add a book…" aria-label="Book title" enterkeyhint="done" autocapitalize="words">')}
        <button class="btn primary" type="submit"><span class="bo"><span class="bi">Add</span></span></button>
      </form>`;
    shelf += active.length ? `<div style="margin-top:12px">${active.map(row).join('')}</div>` : '<div class="empty" style="margin-top:16px">Shelf is empty. Add a book, or log one and it lands here.</div>';
    if (archived.length) {
      shelf += `<button class="link" data-action="toggle-archived">${ui.archivedOpen ? 'Hide' : 'Show'} archived (${archived.length})</button>`;
      if (ui.archivedOpen) shelf += archived.map(row).join('');
    }
    $('#view-books').innerHTML = win('SHELF.DB', shelf);
  }

  // ---------- SETTINGS ----------
  function renderSettings() {
    const cur = accentId();
    const tiles = ACCENTS.map(([id, hex]) => `<button class="tile ${id === cur ? 'on' : ''}" data-action="accent" data-accent="${id}" aria-pressed="${id === cur}" aria-label="${id} accent">
        <span class="bo"><span class="bi">${mouseSVG('read', 3, '', hex)}<span class="swatch" style="background:${hex}"></span><span class="tile-lbl">${id}</span></span></span></button>`).join('');
    const accentWin = `<div class="help">Pick one. It colors the book, buttons, timer and streaks. Mono keeps it gray.</div>
      <div class="tiles">${tiles}</div>
      <div class="lbl">Live preview</div>
      <div class="preview">${mouseSVG('read', 6, '')}<div class="btn primary" aria-hidden="true"><span class="bo"><span class="bi">${icon('play', 2)}Start</span></span></div></div>`;
    const mini = (action, d, label) => btn(icon(d > 0 ? 'plus' : 'minus', 2), action, 'sm', `data-d="${d}" aria-label="${label}"`);
    const last = data.settings.lastExport;
    const ago = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const lastTxt = last === null ? 'No backup yet' : ago === 0 ? 'Last backup: today' : `Last backup: ${ago} day${ago === 1 ? '' : 's'} ago`;
    const prefs = `
      <div class="prow"><span class="pl">Daily goal</span><div class="pctl">${mini('goal', -5, 'Goal 5 minutes lower')}<output class="pv" id="gGoal">${data.settings.goalMin} MIN</output>${mini('goal', 5, 'Goal 5 minutes higher')}</div></div>
      <div class="prow"><span class="pl">Day starts at</span><div class="pctl">${mini('daystart', -1, 'An hour earlier')}<output class="pv" id="gDay">${C.fmtHour(dayHour())}</output>${mini('daystart', 1, 'An hour later')}</div></div>
      <div class="prow"><span class="pl">Export data</span>${btn('[ JSON ]', 'export', 'sm dark')}</div>
      <div class="prow"><span class="pl">Restore backup<br><span style="color:var(--dim)">replaces all</span></span>${btn('[ Import ]', 'import', 'sm')}</div>
      <div class="prow"><span class="pl">Import entries<br><span style="color:var(--dim)">merge, safe twice</span></span>${btn('[ Merge ]', 'import-merge', 'sm')}</div>
      <div class="prow"><span class="pl">Nov 15–22 backfill</span>${btn('[ Load ]', 'backfill', 'sm')}</div>
      <div class="small">Reading before ${C.fmtHour(dayHour())} counts for the day before. ${esc(lastTxt)} · ${data.sessions.length} entr${data.sessions.length === 1 ? 'y' : 'ies'}.</div>
      <div class="note">Data lives <b>only on this phone</b>. Export a backup now and then — save it to Files or iCloud Drive.</div>`;
    $('#view-settings').innerHTML = win('ACCENT_COLOR', accentWin) + win('PREFERENCES', prefs);
  }
  function setGoal(min) {
    data.settings.goalMin = Math.max(5, Math.min(600, Math.round(min) || 60));
    persist();
    renderAll();
  }
  async function exportData() {
    const now = Date.now();
    const json = C.exportJSON(data, now);
    const name = `reading-log-backup-${C.dayKey(now)}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    let done = false;
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Reading log backup' });
        done = true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // closed the share sheet
    }
    if (!done) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    data.settings.lastExport = now;
    persist(); renderAll();
    toast('Backup ready');
  }
  function mergeText(text) {
    let r;
    try { r = C.mergeJSON(data, text); } catch (e) { toast(e.message); return; }
    data = r.data; persist(); renderAll();
    toast(r.added ? `Added ${r.added} entr${r.added === 1 ? 'y' : 'ies'}${r.skipped ? ` · ${r.skipped} already here` : ''}` : `Nothing new · ${r.skipped} already here`);
  }
  function importFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result);
      if (ui.importMode === 'merge') { mergeText(text); return; }
      let next;
      try { next = C.importJSON(text); } catch (e) { toast(e.message); return; }
      if (!confirm(`Replace everything with this backup?\n\n${next.sessions.length} entries, ${next.books.length} books.\nYour current data (${data.sessions.length} entries) will be replaced.`)) return;
      data = next; persist(); renderAll();
      toast('Backup restored');
    };
    reader.onerror = () => toast('Couldn’t read that file');
    reader.readAsText(file);
  }
  async function loadBackfill() {
    try {
      const res = await fetch('backfill.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error();
      mergeText(await res.text());
    } catch (e) { toast('Couldn’t load backfill.json'); }
  }

  // ---------- ADD_ENTRY / EDIT_ENTRY ----------
  function entryPrefill(e) {
    if (e.type !== 'book' || !C.normTitle(e.title)) return '';
    const p = e.mode === 'edit' ? C.pickupPage(data, e.title, { beforeId: e.id }) : C.pickupPage(data, e.title, { date: e.date });
    return p === null ? '' : `${p}-`;
  }
  function openEntry(mode, arg) {
    if (mode === 'edit') {
      const s = data.sessions.find((x) => x.id === arg);
      if (!s) return;
      ui.entry = { mode, id: s.id, manual: s.manual, date: s.manual ? s.date : C.sessionDay(s, dayHour()), startedAt: s.startedAt,
        type: s.type, title: bookTitle(s), minutes: String(Math.round(s.durationMs / C.MIN)), origMs: s.durationMs,
        pages: s.pages, prefill: '', pagesTouched: true, override: s.pagesOverride ?? '', note: s.note };
    } else {
      const date = arg && arg <= today() ? arg : today();
      const last = C.readingOrder(data).pop();
      const type = last ? last.type : ui.draft.type;
      ui.entry = { mode: 'add', id: null, manual: true, date, startedAt: null, type, title: type === ui.draft.type ? ui.draft.title : '',
        minutes: '', pages: '', prefill: '', pagesTouched: false, override: '', note: '' };
      applyEntryPrefill();
    }
    renderEntry();
    $('#ov').hidden = false;
    document.body.classList.add('locked');
  }
  function applyEntryPrefill() {
    const e = ui.entry;
    if (e.pagesTouched) return;
    e.prefill = entryPrefill(e);
    e.pages = e.prefill;
    const el = $('#ePages');
    if (el) { el.value = e.pages; updatePagesSum('e'); }
  }
  function closeEntry() {
    $('#ov').hidden = true; ui.entry = null;
    document.body.classList.remove('locked');
  }
  function renderEntry() {
    const e = ui.entry;
    const dateBlock = e.manual
      ? `<label class="lbl first" for="eDate">Date</label>${field(`<input id="eDate" type="date" value="${e.date}" max="${today()}" required>`, 'id="eDateField"')}`
      : `<div class="lbl first">Timed session</div><div class="meta">${fmtDay(e.date)} · started ${hhmm(e.startedAt)}</div>`;
    const body = `${dateBlock}
      <div class="mt0">${seg(e.type, 'etype')}</div>
      <label class="lbl" for="eTitle">Material</label>
      ${field(`<input id="eTitle" value="${esc(e.title)}" placeholder="${e.type === 'book' ? 'Which book?' : 'Title'}" autocomplete="off" autocapitalize="words">`, 'id="eTitleField"')}
      <div class="chips" id="eChips"></div>
      <label class="lbl" for="eMin">Time read (minutes)</label>
      <div class="stepper3">${holdBtn('eMin', -1, 'Minus 1 minute')}${field(`<input id="eMin" inputmode="numeric" pattern="[0-9]*" value="${esc(e.minutes)}" placeholder="0">`, 'id="eMinField"')}${holdBtn('eMin', 1, 'Plus 1 minute')}</div>
      <div class="chips">${[15, 30, 45, 60].map((m) => chip(String(m), 'emin', String(m) === String(e.minutes), `data-v="${m}"`)).join('')}</div>
      ${e.type === 'book' ? pagesBlock('e', e.pages, e.override, '') : ''}
      <label class="lbl" for="eNote">Note (optional)</label>
      ${field(`<textarea id="eNote" rows="2">${esc(e.note)}</textarea>`)}
      <div class="btn-row">${btn('Cancel', 'close-entry', '')}${btn('Save', 'save-entry', 'primary')}</div>
      ${e.mode === 'add' ? `<div class="mt">${btn('Save + add another', 'save-another', 'sm')}</div>` : '<button class="link" data-action="delete">Delete entry</button>'}`;
    $('#modal').innerHTML = win(e.mode === 'add' ? 'ADD_ENTRY' : 'EDIT_ENTRY', body, { close: 'close-entry' });
    updateEntryChips();
    updatePagesSum('e');
  }
  const updateEntryChips = () => { $('#eChips').innerHTML = chipsHTML(ui.entry.type, ui.entry.title, 'entry'); };
  function captureEntry() {
    const e = ui.entry;
    if ($('#eDate')) e.date = $('#eDate').value;
    e.title = $('#eTitle').value;
    e.minutes = $('#eMin').value;
    e.note = $('#eNote').value;
    if ($('#ePages')) { e.pages = $('#ePages').value; e.override = $('#eOver').value; }
  }
  function saveEntry(another) {
    captureEntry();
    const e = ui.entry;
    const title = e.title.trim();
    const min = readInt(e.minutes);
    if (e.manual && (!C.isDay(e.date) || e.date > today())) { shake($('#eDateField')); toast(e.date > today() ? 'Can’t log the future' : 'Pick a date'); return; }
    if (!title) { shake($('#eTitleField')); toast('Give it a title'); return; }
    if (!min) { shake($('#eMinField')); toast('Add the minutes you read'); return; }
    const now = Date.now();
    const book = e.type === 'book' ? C.upsertBook(data, title, now) : null;
    const pages = book ? finalPages(e.pages, e.pagesTouched ? '' : e.prefill) : '';
    const parsed = C.parsePages(pages);
    const over = book ? readInt(e.override) : null;
    const fields = {
      type: e.type, title: book ? book.title : title, bookId: book ? book.id : null,
      pages, pagesRead: parsed.ranges.length ? parsed.count : null, pagesOverride: over, note: e.note.trim(),
    };
    if (e.mode === 'edit') {
      const s = data.sessions.find((x) => x.id === e.id);
      if (!s) { closeEntry(); return; }
      const ms = String(Math.round(e.origMs / C.MIN)) === String(min) ? e.origMs : min * C.MIN; // keep seconds if untouched
      Object.assign(s, fields, { durationMs: ms }, s.manual ? { date: e.date } : {});
    } else {
      data.sessions.push({ id: C.uid(), manual: true, date: e.date, startedAt: null, endedAt: null, addedAt: now, durationMs: min * C.MIN, ...fields });
    }
    persist();
    if (another) {
      ui.entry = { ...e, mode: 'add', id: null, minutes: '', pages: '', prefill: '', pagesTouched: false, override: '', note: '', title: fields.title };
      applyEntryPrefill();
      renderEntry();
      renderAll();
      $('#ov .wb').scrollTop = 0;
      toast('Saved · add another');
      return;
    }
    closeEntry(); renderAll();
    toast(e.mode === 'edit' ? 'Updated' : 'Entry added');
  }

  // Hold-to-repeat for the − / + minute buttons.
  let holdT = null;
  function syncMinutes(v) {
    if (ui.entry) ui.entry.minutes = String(v);
    for (const c of document.querySelectorAll('[data-action="emin"]')) {
      const on = c.dataset.v === String(v);
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on));
    }
  }
  function stepMinutes(target, d) {
    const el = $('#' + target);
    if (!el) return;
    const v = Math.max(0, (readInt(el.value) || 0) + d);
    el.value = v;
    syncMinutes(v);
  }
  function stopHold() { clearTimeout(holdT); clearInterval(holdT); holdT = null; }
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('[data-hold]');
    if (!b) return;
    e.preventDefault();
    stopHold();
    const step = () => stepMinutes(b.dataset.hold, Number(b.dataset.d));
    step();
    holdT = setTimeout(() => { holdT = setInterval(step, 80); }, 420);
  });
  ['pointerup', 'pointercancel', 'blur'].forEach((ev) => window.addEventListener(ev, stopHold, true));

  // ---------- actions ----------
  function startReading() {
    const d = ui.draft;
    d.title = $('#fMat').value.trim();
    if (!d.title) { shake($('#matField')); toast('Name what you’re reading'); $('#fMat').focus(); return; }
    persistDraft();
    const book = d.type === 'book' ? C.findBook(data, d.title) : null;
    const material = { type: d.type, title: book ? book.title : d.title, fromPage: d.type === 'book' ? C.pickupPage(data, d.title) : null };
    if (document.activeElement) document.activeElement.blur();
    timer = C.start(C.idleTimer(), Date.now(), material);
    persistTimer();
    renderHome(); tick();
  }
  function stopReading() {
    timer = C.stop(timer, Date.now());
    persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    renderHome(); tick();
    window.scrollTo(0, 0);
  }
  function captureSave() {
    const s = ui.save;
    if (!s) return;
    if ($('#sTitle')) s.title = $('#sTitle').value;
    if ($('#sNote')) s.note = $('#sNote').value;
    if ($('#sPages')) { s.pages = $('#sPages').value; s.override = $('#sOver').value; updatePagesSum('s'); }
    persistSaveForm();
  }
  function saveSession() {
    captureSave();
    const s = ui.save;
    const m = saveMaterial();
    const type = m.title ? m.type : s.type;
    const title = (m.title || s.title).trim();
    if (!title) { shake($('#sTitleField')); toast('Give it a title'); return; }
    const now = Date.now();
    const d = C.draftFromTimer(timer, now);
    if (!(d.durationMs > 0)) { toast('Nothing timed — discard it'); return; }
    const book = type === 'book' ? C.upsertBook(data, title, now) : null;
    const pages = book ? finalPages(s.pages, s.pagesTouched ? '' : s.prefill) : '';
    const parsed = C.parsePages(pages);
    data.sessions.push({
      id: C.uid(), manual: false, date: null, type, title: book ? book.title : title, bookId: book ? book.id : null,
      pages, pagesRead: parsed.ranges.length ? parsed.count : null, pagesOverride: book ? readInt(s.override) : null, note: s.note.trim(),
      durationMs: d.durationMs, startedAt: d.startedAt, endedAt: d.endedAt, addedAt: now,
    });
    persist();
    timer = C.idleTimer(); persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    ui.draft = { type, title: book ? book.title : title }; persistDraft();
    renderAll();
    window.scrollTo(0, 0);
    toast('Saved to log');
  }
  function discardSession() {
    if (!confirm('Discard this session? The time won’t be logged.')) return;
    timer = C.idleTimer(); persistTimer();
    ui.save = null; sdel(SAVEFORM_KEY);
    renderAll();
    toast('Discarded');
  }

  function renderAll() {
    ui.lastDay = today();
    renderHeader();
    for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab));
    for (const v of ['today', 'history', 'books', 'settings']) $('#view-' + v).hidden = v !== ui.tab;
    if (ui.tab === 'today') renderHome();
    if (ui.tab === 'history') renderHistory();
    if (ui.tab === 'books') renderBooks();
    if (ui.tab === 'settings') renderSettings();
    tick();
  }
  function setTab(tab) {
    if (ui.tab === 'today' && ui.homeState === 'save') captureSave();
    ui.tab = tab;
    renderAll();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action],[data-tab],[data-hold]');
    if (!el) return;
    if (el.dataset.tab) { setTab(el.dataset.tab); return; }
    if (el.dataset.hold) { if (e.detail === 0) stepMinutes(el.dataset.hold, Number(el.dataset.d)); return; } // keyboard
    switch (el.dataset.action) {
      case 'dtype':
        ui.draft.type = el.dataset.type; ui.draft.title = ''; persistDraft();
        renderHome(); tick(); break;
      case 'chip': case 'newmat': {
        const t = el.dataset.action === 'chip' ? el.dataset.title : '';
        if (el.dataset.target === 'entry') {
          ui.entry.title = t; $('#eTitle').value = t;
          if (ui.entry.mode === 'add') ui.entry.pagesTouched = false;
          updateEntryChips(); applyEntryPrefill();
          if (!t) $('#eTitle').focus();
        } else {
          ui.draft.title = t; $('#fMat').value = t; persistDraft();
          updateChips(); updatePickup();
          if (!t) $('#fMat').focus();
        }
        break;
      }
      case 'start': startReading(); break;
      case 'stop': stopReading(); break;
      case 'pause':
        timer = C.hold(timer, Date.now()); persistTimer(); renderHome(); tick(); break;
      case 'resume':
        timer = C.start(timer, Date.now()); persistTimer(); renderHome(); tick(); break;
      case 'stype':
        captureSave(); ui.save.type = el.dataset.type; persistSaveForm(); renderHome(); break;
      case 'save': saveSession(); break;
      case 'discard': discardSession(); break;
      case 'edit': openEntry('edit', el.dataset.id); break;
      case 'add-entry': openEntry('add', el.dataset.date); break;
      case 'etype':
        captureEntry(); ui.entry.type = el.dataset.type;
        if (ui.entry.mode === 'add') { ui.entry.title = ''; ui.entry.pagesTouched = false; ui.entry.pages = ''; }
        renderEntry(); applyEntryPrefill(); break;
      case 'emin': stepMinutes('eMin', Number(el.dataset.v) - (readInt($('#eMin').value) || 0)); break;
      case 'close-entry': closeEntry(); break;
      case 'save-entry': saveEntry(false); break;
      case 'save-another': saveEntry(true); break;
      case 'delete':
        if (confirm('Delete this entry? This can’t be undone.')) {
          data.sessions = data.sessions.filter((x) => x.id !== ui.entry.id);
          persist(); closeEntry(); renderAll(); toast('Deleted');
        }
        break;
      case 'goal': setGoal(data.settings.goalMin + Number(el.dataset.d)); break;
      case 'daystart':
        data.settings.dayStart = Math.max(0, Math.min(11, dayHour() + Number(el.dataset.d)));
        persist(); renderAll(); break;
      case 'export': exportData(); break;
      case 'import': case 'import-merge':
        ui.importMode = el.dataset.action === 'import' ? 'replace' : 'merge';
        $('#importFile').value = ''; $('#importFile').click(); break;
      case 'backfill': loadBackfill(); break;
      case 'accent': setAccent(el.dataset.accent); break;
      case 'archive': case 'unarchive': {
        const b = data.books.find((x) => x.id === el.dataset.id);
        if (b) { b.archived = el.dataset.action === 'archive'; persist(); renderBooks(); toast(b.archived ? 'Archived' : 'Back on the shelf'); }
        break;
      }
      case 'toggle-archived': ui.archivedOpen = !ui.archivedOpen; renderBooks(); break;
    }
  });
  document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeEntry(); });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    switch (id) {
      case 'fMat': ui.draft.title = e.target.value; persistDraft(); updateChips(); updatePickup(); break;
      case 'sTitle':
        ui.save.title = e.target.value;
        if (!ui.save.pagesTouched && $('#sPages')) {
          ui.save.prefill = savePrefill(e.target.value); ui.save.pages = ui.save.prefill; $('#sPages').value = ui.save.prefill;
        }
        updatePagesSum('s'); persistSaveForm(); break;
      case 'sPages': ui.save.pagesTouched = true; ui.save.pages = e.target.value; updatePagesSum('s'); persistSaveForm(); break;
      case 'sOver': ui.save.override = e.target.value; updatePagesSum('s'); persistSaveForm(); break;
      case 'sNote': ui.save.note = e.target.value; persistSaveForm(); break;
      case 'eTitle': ui.entry.title = e.target.value; updateEntryChips(); applyEntryPrefill(); break;
      case 'eDate': ui.entry.date = e.target.value; applyEntryPrefill(); break;
      case 'ePages': ui.entry.pagesTouched = true; updatePagesSum('e'); break;
      case 'eOver': updatePagesSum('e'); break;
      case 'eMin': syncMinutes(e.target.value.trim()); break;
      case 'gGoal': { const n = parseInt(e.target.value, 10); if (Number.isFinite(n) && n >= 5) setGoal(n); break; }
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'gGoal') { setGoal(parseInt(e.target.value, 10)); e.target.value = data.settings.goalMin; }
    if (e.target.id === 'importFile' && e.target.files[0]) importFile(e.target.files[0]);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#ov').hidden) closeEntry();
    if (e.key === 'Enter' && e.target.id === 'fMat') { e.preventDefault(); startReading(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'addBookForm') return;
    e.preventDefault();
    const t = $('#newBook').value.trim();
    if (!t) { shake($('#newBook').closest('.field')); return; }
    const existed = C.findBook(data, t);
    C.upsertBook(data, t, Date.now());
    persist(); renderBooks();
    toast(existed ? 'Already on the shelf' : 'Shelved');
  });

  // Coming back to the app (after a lock / backgrounding): re-sync from storage & clock.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = C.loadTimer(storage);
    const changed = t.status !== timer.status;
    timer = t;
    if (changed) renderAll(); else tick();
  });
  window.addEventListener('storage', (e) => {
    if (e.key === C.KEY) { data = C.loadData(storage).data; renderAll(); }
    if (e.key === C.TIMER_KEY) { timer = C.loadTimer(storage); renderAll(); }
  });

  // ---------- boot ----------
  const loaded = C.loadData(storage);
  data = loaded.data;
  timer = C.loadTimer(storage);
  const dr = jget(DRAFT_KEY);
  ui.accent = sget(ACCENT_KEY) || 'green';
  ui.draft = dr && C.TYPES.includes(dr.type) ? { type: dr.type, title: typeof dr.title === 'string' ? dr.title : '' } : { type: 'book', title: '' };
  renderTabs();
  renderAll();
  if (loaded.warning) setTimeout(() => toast(loaded.warning), 600);
  setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 250);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
