<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reading Log">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Reading Log</title>
<style>
:root {
  --chart: #DAFF72;
  --chart-press: #C8F24A;
  --chart-soft: #F2FFCC;
  --violet: #4927D0;
  --violet-deep: #3A1CB5;
  --violet-muted: #5F48C6;
  --violet-soft: #E9E4FB;
  --violet-mist: #F3F0FD;
  --bg: #FAFAF5;
  --card: #FFFFFC;
  --line: #E6E1F5;
  --danger: #B0204A;
  --shadow: 0 1px 2px rgba(73, 39, 208, .06), 0 10px 28px -8px rgba(73, 39, 208, .18);
  --shadow-sm: 0 1px 2px rgba(73, 39, 208, .06), 0 4px 12px -4px rgba(73, 39, 208, .14);
  --r-xl: 32px;
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 14px;
  --font: ui-rounded, "SF Pro Rounded", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --tab-h: 68px;
  --ease-bounce: cubic-bezier(.2, .9, .3, 1.15);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--violet);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  min-height: 100dvh; overscroll-behavior-y: none;
}
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
svg { display: block; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  max-width: 560px; margin: 0 auto;
  padding: calc(var(--st) + 12px) calc(var(--sr) + 18px) calc(var(--sb) + var(--tab-h) + 28px) calc(var(--sl) + 18px);
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 44px; height: 44px; border-radius: 15px; background: var(--chart); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-sm); }
.brand-mark .ico { width: 26px; height: 26px; stroke-width: 2.2; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 14px; color: var(--violet-muted); font-weight: 600; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow-sm); flex: none; }

/* ---------- press animation ---------- */
.press { transition: transform .18s var(--ease-bounce), background-color .15s, box-shadow .15s; }
.press:active { transform: scale(.94); }

/* ---------- hero / timer ---------- */
.hero {
  position: relative; overflow: hidden;
  background: var(--violet); color: var(--bg);
  border-radius: var(--r-xl); padding: 26px 20px 22px; box-shadow: var(--shadow);
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: var(--chart); opacity: .09; pointer-events: none; }
.hero::before { width: 220px; height: 220px; right: -90px; top: -100px; }
.hero::after { width: 140px; height: 140px; left: -60px; bottom: -70px; }
.ring-wrap { position: relative; width: min(74vw, 272px); aspect-ratio: 1; margin: 0 auto; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-linecap: round; }
.ring-track { stroke: rgba(250, 250, 245, .14); stroke-width: 20; }
.ring-fill { stroke: var(--chart); stroke-width: 20; transition: stroke-dashoffset .6s ease; }
.ring-bonus-track { stroke: rgba(250, 250, 245, .1); stroke-width: 8; }
.ring-bonus { stroke: var(--bg); stroke-width: 8; transition: stroke-dashoffset .6s ease; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 18%; }
.chunk-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--chart); }
.clock { font-size: clamp(46px, 15vw, 62px); font-weight: 800; letter-spacing: -.03em; line-height: 1.02; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
.today-total { font-size: 15px; font-weight: 700; color: rgba(250, 250, 245, .9); }
.today-total.bonus { color: var(--chart); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--chart); margin-right: 6px; vertical-align: 1px; }
.running .status-dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.hero-msg { text-align: center; margin: 14px 8px 18px; font-size: 15px; font-weight: 600; color: rgba(250, 250, 245, .88); min-height: 21px; }
.controls { display: flex; gap: 12px; }
.sparkles { position: absolute; inset: -6%; pointer-events: none; }
.sparkles span { position: absolute; width: 16px; height: 16px; color: var(--chart); animation: twinkle 2.4s ease-in-out infinite; }
.sparkles span:nth-child(2) { animation-delay: .6s; color: var(--bg); }
.sparkles span:nth-child(3) { animation-delay: 1.2s; }
.sparkles span:nth-child(4) { animation-delay: 1.8s; color: var(--bg); }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

/* ---------- buttons ---------- */
.btn {
  flex: 1; min-height: 58px; border-radius: 999px; font-size: 18px; font-weight: 800; letter-spacing: -.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 22px;
}
.btn .ico { width: 22px; height: 22px; stroke-width: 2.4; }
.btn-primary { background: var(--chart); color: var(--violet); box-shadow: 0 6px 0 -2px rgba(0, 0, 0, .12); }
.btn-primary:active { background: var(--chart-press); }
.btn-ghost-dark { background: rgba(250, 250, 245, .12); color: var(--bg); box-shadow: inset 0 0 0 2px rgba(250, 250, 245, .35); }
.btn-violet { background: var(--violet); color: var(--bg); box-shadow: 0 6px 0 -2px rgba(58, 28, 181, .35); }
.btn-soft { background: var(--violet-mist); color: var(--violet); box-shadow: inset 0 0 0 2px var(--line); }
.btn-danger-text { background: none; color: var(--danger); font-size: 16px; min-height: 48px; flex: none; padding: 0 12px; }
.btn-sm { min-height: 44px; font-size: 15px; padding: 0 16px; flex: none; }
.link-btn { color: var(--violet); font-weight: 700; font-size: 15px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--violet-mist); }

/* ---------- sections & cards ---------- */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 4px 12px; gap: 12px; }
.section-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.entry { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: left; min-height: 72px; }
.entry-ico { width: 44px; height: 44px; border-radius: 14px; background: var(--chart); display: grid; place-items: center; flex: none; }
.entry-ico.article { background: var(--violet-soft); }
.entry-ico.poem { background: var(--chart-soft); box-shadow: inset 0 0 0 2px var(--chart); }
.entry-main { flex: 1; min-width: 0; }
.entry-title { font-weight: 800; font-size: 17px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-meta { font-size: 14px; color: var(--violet-muted); font-weight: 600; margin-top: 2px; }
.entry-note { font-size: 14px; color: var(--violet-muted); margin-top: 4px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { flex: none; font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 999px; background: var(--violet-mist); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 30px 22px; border-radius: var(--r-lg); background: var(--violet-mist); border: 2px dashed var(--line); }
.empty .big { font-size: 34px; margin-bottom: 6px; }
.empty p { margin: 4px 0 0; font-weight: 700; }
.empty small { display: block; margin-top: 6px; color: var(--violet-muted); font-size: 14px; font-weight: 600; }

/* ---------- history ---------- */
.stats { display: grid; grid-template-columns: 1fr; gap: 12px; }
.streak { display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
.streak-num { width: 64px; height: 64px; border-radius: 22px; background: var(--chart); display: grid; place-items: center; font-size: 30px; font-weight: 900; flex: none; font-variant-numeric: tabular-nums; }
.streak h3 { margin: 0; font-size: 18px; font-weight: 800; }
.streak p { margin: 2px 0 0; color: var(--violet-muted); font-weight: 600; font-size: 14px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 16px 12px 14px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day small { font-size: 12px; font-weight: 800; color: var(--violet-muted); letter-spacing: .04em; }
.day-dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; position: relative; font-variant-numeric: tabular-nums; }
.day-dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--violet) calc(var(--p) * 1%), var(--violet-soft) 0); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px); }
.day-dot.hit { background: var(--chart); }
.day-dot.hit::before { display: none; }
.day-dot.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--violet); }
.day-head { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 6px 10px; gap: 10px; }
.day-head h3 { margin: 0; font-size: 17px; font-weight: 800; }
.day-head span { font-weight: 800; font-size: 15px; color: var(--violet-muted); white-space: nowrap; }
.day-head span.hit { color: var(--violet); background: var(--chart); padding: 3px 10px; border-radius: 999px; }
.carried { font-size: 13px; color: var(--violet-muted); font-weight: 600; margin: -4px 6px 6px; }

/* ---------- books ---------- */
.add-book { display: flex; gap: 10px; padding: 10px; }
.add-book input { flex: 1; min-width: 0; }
.book-card { padding: 16px 16px 16px 18px; display: flex; align-items: center; gap: 14px; }
.book-spine { width: 10px; align-self: stretch; border-radius: 6px; background: var(--chart); flex: none; }
.book-card.archived .book-spine { background: var(--violet-soft); }
.book-main { flex: 1; min-width: 0; }
.book-title { font-weight: 800; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.book-meta { font-size: 14px; color: var(--violet-muted); font-weight: 600; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.archive-toggle { margin: 22px auto 0; display: flex; }

/* ---------- inputs ---------- */
.field { display: block; margin-top: 16px; }
.field > span { display: block; font-size: 14px; font-weight: 800; margin: 0 4px 6px; }
.input {
  width: 100%; min-height: 52px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--bg);
  padding: 12px 16px; font-size: 17px; font-weight: 600; outline: none; appearance: none; -webkit-appearance: none;
}
.input:focus { border-color: var(--violet); background: var(--card); }
textarea.input { min-height: 84px; resize: vertical; }
.input::placeholder { color: #9A8EDA; font-weight: 500; }
.err .input, .input.err { border-color: var(--danger); }
.field-hint { font-size: 13px; color: var(--violet-muted); font-weight: 600; margin: 6px 6px 0; min-height: 18px; }
.field-hint.error { color: var(--danger); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--violet-mist); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { min-height: 46px; border-radius: 999px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--violet-muted); }
.seg button .ico { width: 20px; height: 20px; }
.seg button[aria-pressed="true"] { background: var(--violet); color: var(--bg); box-shadow: var(--shadow-sm); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { min-height: 40px; max-width: 100%; padding: 0 14px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--chart); box-shadow: inset 0 0 0 2px var(--violet); }
.chip small { font-weight: 600; color: var(--violet-muted); margin-left: 4px; }

.pages { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.pages .arrow { padding-bottom: 14px; font-weight: 800; color: var(--violet-muted); }
.pages .field { margin-top: 0; }
.pages-read { margin-top: 10px; display: inline-flex; padding: 6px 14px; border-radius: 999px; background: var(--chart); font-weight: 800; font-size: 15px; }
.pages-read.muted { background: var(--violet-mist); color: var(--violet-muted); }

.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 50px; height: 52px; border-radius: 50%; background: var(--violet-mist); font-weight: 800; font-size: 15px; flex: none; box-shadow: inset 0 0 0 2px var(--line); }
.stepper .input { text-align: center; font-size: 22px; font-weight: 800; padding: 8px; font-variant-numeric: tabular-nums; }
.stepper-wrap { position: relative; flex: 1; }
.stepper-wrap em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 700; color: var(--violet-muted); pointer-events: none; font-size: 15px; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(37, 18, 110, .38); opacity: 0; transition: opacity .25s; z-index: 20; pointer-events: none; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0 auto; max-width: 560px;
  max-height: calc(100dvh - var(--st) - 16px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  background: var(--card); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: 0 -10px 40px rgba(37, 18, 110, .22);
  padding: 10px calc(var(--sr) + 20px) calc(var(--sb) + 22px) calc(var(--sl) + 20px);
  transform: translateY(105%); visibility: hidden; transition: transform .34s var(--ease-bounce), visibility 0s .34s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .34s var(--ease-bounce), visibility 0s; }
.grabber { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.sheet-head p { margin: 2px 0 0; color: var(--violet-muted); font-weight: 600; font-size: 14px; }
.close-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--violet-mist); display: grid; place-items: center; flex: none; }
.sheet-actions { display: flex; gap: 10px; margin-top: 24px; align-items: center; }
.sheet-section { margin-top: 18px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: var(--r-md); background: var(--violet-mist); margin-top: 12px; }
.setting-row h3 { margin: 0; font-size: 16px; font-weight: 800; }
.setting-row p { margin: 2px 0 0; font-size: 13px; color: var(--violet-muted); font-weight: 600; }
.note-box { margin-top: 16px; padding: 14px 16px; border-radius: var(--r-md); background: var(--chart-soft); font-size: 14px; font-weight: 600; line-height: 1.45; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 8px calc(var(--sr) + 14px) calc(var(--sb) + 8px) calc(var(--sl) + 14px);
  background: linear-gradient(to top, var(--bg) 60%, rgba(250, 250, 245, 0));
}
.tabbar-inner { max-width: 440px; margin: 0 auto; background: var(--violet); border-radius: 999px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; box-shadow: var(--shadow); }
.tab { min-height: 56px; border-radius: 999px; color: rgba(250, 250, 245, .78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 800; letter-spacing: .02em; position: relative; }
.tab .ico { width: 24px; height: 24px; }
.tab[aria-selected="true"] { background: var(--chart); color: var(--violet); }
.tab .tab-dot { position: absolute; top: 9px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--chart); box-shadow: 0 0 0 2px var(--violet); }

/* ---------- toast & confetti ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--sb) + var(--tab-h) + 30px); z-index: 50;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--violet); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: 15px;
  box-shadow: var(--shadow); transition: opacity .25s, transform .3s var(--ease-bounce); width: max-content; max-width: calc(100vw - 40px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .press:active { transform: none; opacity: .8; }
  .sparkles span { opacity: .8; }
}
</style>
</head>

<script>
/*CORE-START*/
// Pure, DOM-free logic. Everything time-related takes `now` explicitly so it can be tested.
(function (root) {
  'use strict';
  const SCHEMA = 1;
  const KEY = 'readinglog.data';
  const TIMER_KEY = 'readinglog.timer';
  const TYPES = ['book', 'article', 'poem'];
  const MIN = 60000;

  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ----- dates (local time) -----
  function dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function parseDay(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(key, n) {
    const d = parseDay(key);
    d.setDate(d.getDate() + n);
    return dayKey(d.getTime());
  }
  function nextMidnight(ts) {
    const d = new Date(ts);
    d.setHours(24, 0, 0, 0); // DST-safe: lets the Date object handle 23/25h days
    return d.getTime();
  }
  // Split the interval [a, b) into milliseconds per local day.
  function splitByDay(a, b, out) {
    out = out || {};
    let t = a;
    while (t < b) {
      const m = Math.min(nextMidnight(t), b);
      const k = dayKey(t);
      out[k] = (out[k] || 0) + (m - t);
      t = m;
    }
    return out;
  }

  // ----- timer (timestamp based) -----
  // { status: 'idle'|'running'|'paused', segments: [{start,end}], runStart: ts|null }
  const idleTimer = () => ({ status: 'idle', segments: [], runStart: null });
  function start(t, now) {
    if (t.status === 'running') return t;
    return { status: 'running', segments: t.segments.slice(), runStart: now };
  }
  function pause(t, now) {
    if (t.status !== 'running') return t;
    const end = Math.max(now, t.runStart); // guard against the clock going backwards
    const segments = t.segments.concat(end > t.runStart ? [{ start: t.runStart, end }] : []);
    return { status: 'paused', segments, runStart: null };
  }
  function segmentsAt(t, now) {
    if (t.status !== 'running') return t.segments;
    return t.segments.concat([{ start: t.runStart, end: Math.max(now, t.runStart) }]);
  }
  function elapsed(t, now) {
    return segmentsAt(t, now).reduce((s, g) => s + (g.end - g.start), 0);
  }
  function timerAlloc(t, now) {
    const out = {};
    for (const g of segmentsAt(t, now)) splitByDay(g.start, g.end, out);
    return out;
  }
  // What the log sheet needs when you tap Finish.
  function draftFromTimer(t, now) {
    const segs = segmentsAt(t, now);
    return {
      durationMs: elapsed(t, now),
      alloc: timerAlloc(t, now),
      startedAt: segs.length ? segs[0].start : now,
      endedAt: segs.length ? segs[segs.length - 1].end : now,
    };
  }

  // Rescale a per-day allocation to a new total (when you edit the time).
  function scaleAlloc(alloc, ms, fallbackDay) {
    const keys = Object.keys(alloc || {}).filter((k) => alloc[k] > 0).sort();
    const total = keys.reduce((s, k) => s + alloc[k], 0);
    if (!keys.length || total <= 0) return { [fallbackDay]: ms };
    const out = {};
    let acc = 0;
    keys.forEach((k, i) => {
      const v = i === keys.length - 1 ? Math.max(0, ms - acc) : Math.round((alloc[k] * ms) / total);
      out[k] = v;
      acc += v;
    });
    return out;
  }
  // The day a session is listed under: the (latest) day it counted toward.
  function sessionDay(s) {
    const keys = Object.keys(s.alloc || {}).sort();
    return keys.length ? keys[keys.length - 1] : dayKey(s.endedAt);
  }
  function dayTotals(sessions, extraAlloc) {
    const out = {};
    for (const s of sessions) for (const k in s.alloc) out[k] = (out[k] || 0) + s.alloc[k];
    if (extraAlloc) for (const k in extraAlloc) out[k] = (out[k] || 0) + extraAlloc[k];
    return out;
  }
  function todayTotal(data, timer, now) {
    const k = dayKey(now);
    return (dayTotals(data.sessions)[k] || 0) + (timerAlloc(timer, now)[k] || 0);
  }

  // Progress ring: first lap toward the goal, then bonus laps.
  function ringState(totalMs, goalMs) {
    const p = goalMs > 0 ? totalMs / goalMs : 0;
    const extra = Math.max(0, p - 1);
    let bonus = extra - Math.floor(extra);
    if (extra > 0 && bonus === 0) bonus = 1;
    return {
      lap1: Math.min(1, p),
      bonus: extra > 0 ? bonus : 0,
      reached: totalMs >= goalMs,
      isBonus: totalMs >= goalMs + MIN,
      lap: Math.floor(p) + 1,
    };
  }
  function crossedGoal(prevMs, nowMs, goalMs) {
    return prevMs < goalMs && nowMs >= goalMs;
  }

  // Current streak of days that hit the goal. Today not hitting yet doesn't break it.
  function streak(totals, todayKey, goalMs) {
    let d = todayKey;
    if ((totals[d] || 0) < goalMs) d = addDays(d, -1);
    let n = 0;
    while ((totals[d] || 0) >= goalMs) { n++; d = addDays(d, -1); }
    return n;
  }
  function week(totals, todayKey, goalMs) {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const k = addDays(todayKey, -i);
      const ms = totals[k] || 0;
      out.push({ key: k, ms, pct: Math.min(100, Math.round((ms / goalMs) * 100)), hit: ms >= goalMs, today: i === 0 });
    }
    return out;
  }

  // ----- books & pages -----
  const normTitle = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  function findBook(data, title) {
    const n = normTitle(title);
    if (!n) return null;
    return data.books.find((b) => normTitle(b.title) === n) || null;
  }
  function upsertBook(data, title, now) {
    let b = findBook(data, title);
    if (b) { b.archived = false; return b; }
    b = { id: uid(), title: String(title).trim().replace(/\s+/g, ' '), archived: false, createdAt: now };
    data.books.push(b);
    return b;
  }
  // The last end page you logged for a book (by most recent session), ignoring `excludeId`.
  function lastEndPage(sessions, bookId, excludeId) {
    let best = null;
    for (const s of sessions) {
      if (s.id === excludeId || s.type !== 'book' || s.bookId !== bookId) continue;
      if (!Number.isFinite(s.endPage)) continue;
      if (!best || s.endedAt > best.endedAt) best = s;
    }
    return best ? best.endPage : null;
  }
  function prefillStartPage(data, title, excludeId) {
    const b = findBook(data, title);
    return b ? lastEndPage(data.sessions, b.id, excludeId) : null;
  }
  function pagesRead(startPage, endPage) {
    if (!Number.isFinite(startPage) || !Number.isFinite(endPage) || endPage < startPage) return null;
    return endPage - startPage;
  }
  function bookStats(data) {
    const out = {};
    for (const b of data.books) out[b.id] = { totalMs: 0, count: 0, lastReadAt: 0, lastPage: lastEndPage(data.sessions, b.id) };
    for (const s of data.sessions) {
      const st = s.type === 'book' && out[s.bookId];
      if (!st) continue;
      st.totalMs += s.durationMs; st.count++; st.lastReadAt = Math.max(st.lastReadAt, s.endedAt);
    }
    return out;
  }
  function recentTitles(sessions, type, limit) {
    const seen = new Set(); const out = [];
    for (const s of sessions.slice().sort((a, b) => b.endedAt - a.endedAt)) {
      if (s.type !== type) continue;
      const n = normTitle(s.title);
      if (!n || seen.has(n)) continue;
      seen.add(n); out.push(s.title);
      if (out.length >= (limit || 8)) break;
    }
    return out;
  }

  // ----- formatting -----
  function fmtDur(ms) {
    if (ms > 0 && ms < MIN) return '<1m';
    const m = Math.floor(ms / MIN), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${m}m`;
  }
  function fmtClock(ms) {
    const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
  }
  function totalLabel(totalMs, goalMs) {
    const r = ringState(totalMs, goalMs);
    if (r.isBonus) return `${fmtDur(totalMs)} — bonus time!`;
    if (r.reached) return 'Goal reached!';
    return `${fmtDur(totalMs)} of ${fmtDur(goalMs)}`;
  }

  // ----- storage -----
  const freshData = () => ({ schema: SCHEMA, settings: { goalMin: 60, lastExport: null }, books: [], sessions: [] });
  const num = (v) => (v === null || v === undefined || v === '' ? null : Number.isFinite(Number(v)) ? Number(v) : null);

  function migrate(obj) {
    // Schema 0 (pre-versioned) → 1: nothing to transform beyond sanitizing; add future steps here.
    if (!obj.schema) obj.schema = 1;
    if (obj.schema > SCHEMA) throw new Error(`This backup is from a newer version (schema ${obj.schema}).`);
    return obj;
  }
  function sanitize(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Not a reading log backup.');
    obj = migrate(obj);
    const data = freshData();
    const st = obj.settings || {};
    const g = num(st.goalMin);
    data.settings.goalMin = g && g >= 1 && g <= 1440 ? Math.round(g) : 60;
    data.settings.lastExport = num(st.lastExport);
    const seenBooks = new Set();
    for (const b of Array.isArray(obj.books) ? obj.books : []) {
      if (!b || typeof b.title !== 'string' || !b.title.trim()) continue;
      const id = typeof b.id === 'string' && b.id ? b.id : uid();
      if (seenBooks.has(id)) continue;
      seenBooks.add(id);
      data.books.push({ id, title: b.title.trim(), archived: !!b.archived, createdAt: num(b.createdAt) || 0 });
    }
    for (const s of Array.isArray(obj.sessions) ? obj.sessions : []) {
      if (!s || typeof s !== 'object') continue;
      const durationMs = num(s.durationMs);
      const endedAt = num(s.endedAt);
      if (durationMs === null || durationMs < 0 || endedAt === null) continue;
      let alloc = {};
      if (s.alloc && typeof s.alloc === 'object') {
        for (const k in s.alloc) if (/^\d{4}-\d\d-\d\d$/.test(k) && num(s.alloc[k]) > 0) alloc[k] = num(s.alloc[k]);
      }
      if (!Object.keys(alloc).length) alloc = { [dayKey(endedAt)]: durationMs };
      const type = TYPES.includes(s.type) ? s.type : 'book';
      const bookId = type === 'book' && seenBooks.has(s.bookId) ? s.bookId : null;
      data.sessions.push({
        id: typeof s.id === 'string' && s.id ? s.id : uid(),
        type, title: typeof s.title === 'string' ? s.title : '', bookId,
        startPage: type === 'book' ? num(s.startPage) : null,
        endPage: type === 'book' ? num(s.endPage) : null,
        note: typeof s.note === 'string' ? s.note : '',
        durationMs, alloc,
        startedAt: num(s.startedAt) ?? endedAt - durationMs, endedAt,
      });
    }
    // Book sessions whose book went missing: re-link by title.
    for (const s of data.sessions) {
      if (s.type === 'book' && !s.bookId && s.title.trim()) s.bookId = upsertBook(data, s.title, s.endedAt).id;
    }
    return data;
  }
  function loadData(storage) {
    let raw = null;
    try { raw = storage.getItem(KEY); } catch (e) { /* storage unavailable */ }
    if (!raw) return { data: freshData() };
    try {
      return { data: sanitize(JSON.parse(raw)) };
    } catch (e) {
      try { storage.setItem(`${KEY}.corrupt.${Date.now()}`, raw); } catch (_) {}
      return { data: freshData(), warning: 'Saved data looked damaged, so I set it aside and started fresh. Import a backup to restore.' };
    }
  }
  function saveData(storage, data) {
    storage.setItem(KEY, JSON.stringify(data));
  }
  function loadTimer(storage) {
    try {
      const t = JSON.parse(storage.getItem(TIMER_KEY) || 'null');
      if (!t || !['idle', 'running', 'paused'].includes(t.status)) return idleTimer();
      const segments = (Array.isArray(t.segments) ? t.segments : [])
        .filter((g) => g && Number.isFinite(g.start) && Number.isFinite(g.end) && g.end >= g.start)
        .map((g) => ({ start: g.start, end: g.end }));
      if (t.status === 'running') {
        if (!Number.isFinite(t.runStart)) return segments.length ? { status: 'paused', segments, runStart: null } : idleTimer();
        return { status: 'running', segments, runStart: t.runStart };
      }
      if (t.status === 'paused' && segments.length) return { status: 'paused', segments, runStart: null };
      return idleTimer();
    } catch (e) {
      return idleTimer();
    }
  }
  function saveTimer(storage, t) {
    storage.setItem(TIMER_KEY, JSON.stringify(t));
  }
  function exportJSON(data, now) {
    return JSON.stringify({ app: 'reading-log', exportedAt: new Date(now).toISOString(), ...data }, null, 2);
  }
  function importJSON(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error('That file isn’t valid JSON.'); }
    if (!obj || (!Array.isArray(obj.sessions) && !Array.isArray(obj.books))) throw new Error('That doesn’t look like a reading log backup.');
    return sanitize(obj);
  }

  root.Core = {
    SCHEMA, KEY, TIMER_KEY, MIN, uid,
    dayKey, addDays, parseDay, splitByDay,
    idleTimer, start, pause, segmentsAt, elapsed, timerAlloc, draftFromTimer,
    scaleAlloc, sessionDay, dayTotals, todayTotal, ringState, crossedGoal, streak, week,
    normTitle, findBook, upsertBook, lastEndPage, prefillStartPage, pagesRead, bookStats, recentTitles,
    fmtDur, fmtClock, totalLabel,
    freshData, sanitize, loadData, saveData, loadTimer, saveTimer, exportJSON, importJSON,
  };
})(typeof window !== 'undefined' ? window : globalThis);
/*CORE-END*/
</script>

<script>
(function () {
  'use strict';
  const C = window.Core;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls) => `<svg class="ico ${cls || ''}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const TYPE_LABEL = { book: 'Book', article: 'Article', poem: 'Poem' };
  const TYPE_ICON = { book: 'book', article: 'article', poem: 'poem' };

  // localStorage can throw (private mode / disabled). Fall back to memory so the app still works.
  const storage = (() => {
    try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) {
      const m = new Map();
      setTimeout(() => toast('Storage is off, so nothing will be saved after you close the app.'), 800);
      return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) };
    }
  })();

  let data, timer;
  const ui = { tab: 'today', sheet: null, archivedOpen: false, lastDay: null };

  function persist() {
    try { C.saveData(storage, data); } catch (e) { toast('Couldn’t save — your phone may be out of space.'); }
  }
  function persistTimer() {
    try { C.saveTimer(storage, timer); } catch (e) { /* keep running in memory */ }
  }
  const goalMs = () => data.settings.goalMin * C.MIN;

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // ---------- confetti ----------
  function celebrate() {
    toast('Daily goal reached! 🎉');
    if (reduceMotion.matches) return;
    const cv = $('#confetti'), ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#DAFF72', '#4927D0', '#B9A8F5', '#DAFF72', '#FFFFFC'];
    const parts = Array.from({ length: 110 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .32,
      vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: colors[(Math.random() * colors.length) | 0],
      round: Math.random() < .3,
    }));
    const t0 = performance.now();
    (function frame(t) {
      const age = t - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - age / 2200);
        ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (age < 2200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }
  function checkGoal(prevTotal) {
    const today = C.dayKey(Date.now());
    const total = C.todayTotal(data, timer, Date.now());
    let done = null;
    try { done = storage.getItem('readinglog.celebrated'); } catch (e) {}
    if (total >= goalMs() && done !== today && (prevTotal === undefined || C.crossedGoal(prevTotal, total, goalMs()))) {
      try { storage.setItem('readinglog.celebrated', today); } catch (e) {}
      celebrate();
    }
  }

  // ---------- header ----------
  function renderHeader() {
    $('#dateLine').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  // ---------- today ----------
  const R1 = 2 * Math.PI * 104, R2 = 2 * Math.PI * 82;
  $('#ringFill').style.strokeDasharray = R1;
  $('#ringBonus').style.strokeDasharray = R2;

  let lastTickTotal;
  function tick() {
    const now = Date.now();
    if (C.dayKey(now) !== ui.lastDay) { renderAll(); return; }
    const total = C.todayTotal(data, timer, now);
    const r = C.ringState(total, goalMs());
    const ms = C.elapsed(timer, now);
    $('#clock').textContent = C.fmtClock(ms);
    const lbl = $('#todayTotal');
    lbl.textContent = 'Today: ' + C.totalLabel(total, goalMs());
    lbl.classList.toggle('bonus', r.reached);
    $('#ringFill').style.strokeDashoffset = R1 * (1 - r.lap1);
    // A hair of progress so the round cap shows the moment you start.
    if (r.lap1 > 0 && r.lap1 < .004) $('#ringFill').style.strokeDashoffset = R1 * .996;
    $('#ringFill').style.opacity = r.lap1 > 0 ? 1 : 0; // the round cap would otherwise show a dot at 0
    const showBonus = total > goalMs();
    $('#bonusTrack').style.display = $('#ringBonus').style.display = showBonus ? '' : 'none';
    $('#ringBonus').style.strokeDashoffset = R2 * (1 - Math.max(r.bonus, .004));
    $('#sparkles').hidden = !r.reached;
    const msg = heroMessage(total);
    if ($('#heroMsg').textContent !== msg) $('#heroMsg').textContent = msg;
    if (timer.status === 'running' && lastTickTotal !== undefined) checkGoal(lastTickTotal);
    lastTickTotal = total;
    $('#tabDot').hidden = !(timer.status === 'running' && ui.tab !== 'today');
  }

  function heroMessage(total) {
    const g = goalMs();
    const r = C.ringState(total, g);
    if (timer.status === 'running') return r.reached ? 'Everything now is bonus ✨ keep going!' : 'Reading… it keeps counting even if your phone locks.';
    if (timer.status === 'paused') return 'Paused — take a breather, then pick it back up.';
    if (r.isBonus) return 'Goal smashed. Anything more is a lovely bonus.';
    if (r.reached) return 'You did it! An hour of reading today. 🎉';
    if (total === 0) return 'Ready when you are. Grab your book!';
    return `${C.fmtDur(g - total)} to go — you’ve got this.`;
  }

  function renderToday() {
    const st = timer.status;
    const hero = $('#hero');
    hero.classList.toggle('running', st === 'running');
    $('#chunkLabel').innerHTML = st === 'idle' ? 'this chunk' : `<span class="status-dot"></span>${st === 'running' ? 'reading' : 'paused'}`;
    const total = C.todayTotal(data, timer, Date.now());
    $('#heroMsg').textContent = heroMessage(total);
    const c = $('#controls');
    if (st === 'idle') {
      c.innerHTML = `<button class="btn btn-primary press" data-action="start">${icon('play')}Start reading</button>`;
    } else if (st === 'running') {
      c.innerHTML = `<button class="btn btn-ghost-dark press" data-action="pause">${icon('pause')}Pause</button>
        <button class="btn btn-primary press" data-action="finish">${icon('check')}Finish</button>`;
    } else {
      c.innerHTML = `<button class="btn btn-primary press" data-action="resume">${icon('play')}Resume</button>
        <button class="btn btn-ghost-dark press" data-action="finish">${icon('check')}Finish</button>`;
    }
    const today = C.dayKey(Date.now());
    const list = data.sessions.filter((s) => C.sessionDay(s) === today).sort((a, b) => b.endedAt - a.endedAt);
    $('#todayList').innerHTML = list.length ? list.map(entryHTML).join('') : `
      <div class="empty"><div class="big">📖</div><p>Nothing read yet today — your book misses you.</p>
      <small>Tap Start reading, then Finish when you’re done to log it.</small></div>`;
    tick();
  }

  function bookTitle(s) {
    const b = s.bookId && data.books.find((x) => x.id === s.bookId);
    return b ? b.title : s.title || 'Untitled';
  }
  function entryHTML(s) {
    const meta = [TYPE_LABEL[s.type]];
    if (s.type === 'book') {
      const pr = C.pagesRead(s.startPage, s.endPage);
      if (Number.isFinite(s.startPage) && Number.isFinite(s.endPage)) meta.push(`p. ${s.startPage}→${s.endPage}${pr !== null ? ` · ${pr} pages` : ''}`);
      else if (Number.isFinite(s.endPage)) meta.push(`to p. ${s.endPage}`);
    }
    meta.push(new Date(s.endedAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }));
    return `<button class="card entry press" data-action="edit" data-id="${esc(s.id)}">
      <span class="entry-ico ${s.type}">${icon(TYPE_ICON[s.type])}</span>
      <span class="entry-main">
        <span class="entry-title" style="display:block">${esc(bookTitle(s))}</span>
        <span class="entry-meta" style="display:block">${esc(meta.join(' · '))}</span>
        ${s.note ? `<span class="entry-note" style="display:block">“${esc(s.note)}”</span>` : ''}
      </span>
      <span class="pill">${C.fmtDur(s.durationMs)}</span>
    </button>`;
  }

  // ---------- history ----------
  function dayLabel(key) {
    const today = C.dayKey(Date.now());
    if (key === today) return 'Today';
    if (key === C.addDays(today, -1)) return 'Yesterday';
    const d = C.parseDay(key);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
  }
  function renderHistory() {
    const now = Date.now();
    const today = C.dayKey(now);
    const totals = C.dayTotals(data.sessions, C.timerAlloc(timer, now));
    const g = goalMs();
    const n = C.streak(totals, today, g);
    const wk = C.week(totals, today, g);
    const todayHit = (totals[today] || 0) >= g;
    const streakMsg = n === 0 ? 'Hit your goal today to start one.'
      : todayHit ? 'Today counts! See you tomorrow.' : 'Read today to keep it going.';
    const days = Object.keys(C.dayTotals(data.sessions)).sort().reverse();
    const byDay = {};
    for (const s of data.sessions) (byDay[C.sessionDay(s)] ||= []).push(s);

    let html = `<div class="stats">
      <div class="card streak"><div class="streak-num">${n}</div><div>
        <h3>${n === 1 ? '1-day streak' : `${n}-day streak`}${n >= 3 ? ' 🔥' : ''}</h3><p>${streakMsg}</p></div></div>
      <div class="card week" aria-label="Last 7 days">${wk.map((d) => {
        const dt = C.parseDay(d.key);
        const wd = dt.toLocaleDateString(undefined, { weekday: 'narrow' });
        return `<div class="day"><small>${esc(wd)}</small>
          <div class="day-dot ${d.hit ? 'hit' : ''} ${d.today ? 'today' : ''}" style="--p:${d.pct}" aria-label="${esc(dayLabel(d.key))}: ${C.fmtDur(d.ms)}${d.hit ? ', goal hit' : ''}">${d.hit ? icon('check') : dt.getDate()}</div></div>`;
      }).join('')}</div></div>`;

    if (!days.length) {
      html += `<div class="section-head"><h2>Your days</h2></div>
        <div class="empty"><div class="big">🗓️</div><p>No reading logged yet.</p><small>Your days will stack up here, one cozy chunk at a time.</small></div>`;
    } else {
      html += `<div class="section-head" style="margin-bottom:0"><h2>Your days</h2></div>`;
      for (const k of days) {
        const t = C.dayTotals(data.sessions)[k] || 0;
        const hit = t >= g;
        const list = (byDay[k] || []).sort((a, b) => b.endedAt - a.endedAt);
        html += `<div class="day-head"><h3>${esc(dayLabel(k))}</h3><span class="${hit ? 'hit' : ''}">${hit ? '✓ ' : ''}${C.fmtDur(t)}</span></div>`;
        if (!list.length) html += `<p class="carried">Time from a session that ran past midnight.</p>`;
        html += `<div class="list">${list.map(entryHTML).join('')}</div>`;
      }
    }
    $('#view-history').innerHTML = html;
  }

  // ---------- books ----------
  function renderBooks() {
    const stats = C.bookStats(data);
    const sortFn = (a, b) => (stats[b.id].lastReadAt || b.createdAt) - (stats[a.id].lastReadAt || a.createdAt);
    const active = data.books.filter((b) => !b.archived).sort(sortFn);
    const archived = data.books.filter((b) => b.archived).sort(sortFn);
    const card = (b) => {
      const s = stats[b.id];
      const meta = [`${C.fmtDur(s.totalMs)} total`];
      if (s.lastPage !== null) meta.push(`last page ${s.lastPage}`);
      meta.push(s.count === 1 ? '1 session' : `${s.count} sessions`);
      return `<div class="card book-card ${b.archived ? 'archived' : ''}">
        <span class="book-spine"></span>
        <div class="book-main"><div class="book-title">${esc(b.title)}</div>
          <div class="book-meta">${meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div></div>
        <button class="btn btn-soft btn-sm press" data-action="${b.archived ? 'unarchive' : 'archive'}" data-id="${esc(b.id)}">${b.archived ? 'Restore' : 'Archive'}</button>
      </div>`;
    };
    let html = `<form class="card add-book" id="addBookForm" autocomplete="off">
        <label class="sr" for="newBook">Book title</label>
        <input class="input" id="newBook" placeholder="Add a book to your shelf…" enterkeyhint="done">
        <button class="btn btn-violet btn-sm press" type="submit">Add</button>
      </form>
      <div class="section-head"><h2>On your shelf</h2><span class="pill">${active.length}</span></div>`;
    html += active.length ? `<div class="list">${active.map(card).join('')}</div>`
      : `<div class="empty"><div class="big">📚</div><p>Your shelf is empty.</p><small>Add a book above, or log a book session and it’ll land here automatically.</small></div>`;
    if (archived.length) {
      html += `<button class="link-btn archive-toggle press" data-action="toggle-archived">${ui.archivedOpen ? 'Hide' : 'Show'} archived (${archived.length})</button>`;
      if (ui.archivedOpen) html += `<div class="list" style="margin-top:12px">${archived.map(card).join('')}</div>`;
    }
    $('#view-books').innerHTML = html;
  }

  function renderAll() {
    ui.lastDay = C.dayKey(Date.now());
    renderHeader();
    renderToday();
    if (ui.tab === 'history') renderHistory();
    if (ui.tab === 'books') renderBooks();
  }

  function setTab(tab) {
    ui.tab = tab;
    for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    for (const v of ['today', 'history', 'books']) $('#view-' + v).hidden = v !== tab;
    renderAll();
    window.scrollTo(0, 0);
  }

  // ---------- sheets ----------
  function openSheet(el) {
    $('#scrim').classList.add('open');
    el.classList.add('open');
    document.body.classList.add('locked');
    el.scrollTop = 0;
  }
  function closeSheets() {
    for (const s of document.querySelectorAll('.sheet')) s.classList.remove('open');
    $('#scrim').classList.remove('open');
    document.body.classList.remove('locked');
    if (document.activeElement) document.activeElement.blur();
  }

  // Log sheet. mode: 'finish' (from timer), 'manual', 'edit'
  function openLog(mode, session) {
    const now = Date.now();
    let s;
    if (mode === 'edit') {
      s = { mode, id: session.id, type: session.type, title: bookTitle(session), startPage: session.startPage, endPage: session.endPage,
        note: session.note, durMs: session.durationMs, origDur: session.durationMs, alloc: session.alloc,
        startedAt: session.startedAt, endedAt: session.endedAt, startTouched: true };
    } else if (mode === 'finish') {
      const d = C.draftFromTimer(timer, now);
      s = { mode, type: lastType(), title: '', startPage: null, endPage: null, note: '', durMs: d.durationMs, origDur: d.durationMs,
        alloc: d.alloc, startedAt: d.startedAt, endedAt: d.endedAt, startTouched: false };
    } else {
      s = { mode, type: lastType(), title: '', startPage: null, endPage: null, note: '', durMs: 15 * C.MIN, origDur: null,
        alloc: null, startedAt: null, endedAt: null, startTouched: false };
    }
    ui.sheet = s;
    renderLogSheet();
    openSheet($('#logSheet'));
  }
  function lastType() {
    const s = data.sessions.slice().sort((a, b) => b.endedAt - a.endedAt)[0];
    return s ? s.type : 'book';
  }

  function renderLogSheet() {
    const s = ui.sheet;
    const heads = {
      finish: ['Nice reading!', `You read for ${C.fmtDur(s.durMs)}. What was it?`],
      manual: ['Add a session', 'For reading you didn’t time.'],
      edit: ['Edit session', new Date(s.endedAt).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })],
    }[s.mode];
    const titlePh = { book: 'Which book?', article: 'Article title', poem: 'Poem title' }[s.type];
    const v = (x) => (Number.isFinite(x) ? x : '');
    $('#logSheet').innerHTML = `
      <div class="grabber"></div>
      <div class="sheet-head">
        <div><h2 id="logTitle">${esc(heads[0])}</h2><p>${esc(heads[1])}</p></div>
        <button class="close-btn press" data-action="close-log" aria-label="Close">${icon('x')}</button>
      </div>
      <div class="sheet-section">
        <div class="seg" role="group" aria-label="Type">
          ${['book', 'article', 'poem'].map((t) => `<button class="press" data-action="type" data-type="${t}" aria-pressed="${s.type === t}">${icon(TYPE_ICON[t])}${TYPE_LABEL[t]}</button>`).join('')}
        </div>
      </div>
      <label class="field" id="titleField"><span>Title</span>
        <input class="input" id="fTitle" value="${esc(s.title)}" placeholder="${titlePh}" autocomplete="off" autocapitalize="words" enterkeyhint="next">
      </label>
      <div class="chips" id="chips"></div>
      <div class="field-hint" id="titleHint"></div>
      ${s.type === 'book' ? `
      <div class="sheet-section">
        <div class="pages">
          <label class="field"><span>Start page</span><input class="input" id="fStart" inputmode="numeric" pattern="[0-9]*" value="${v(s.startPage)}" placeholder="—"></label>
          <span class="arrow">→</span>
          <label class="field"><span>End page</span><input class="input" id="fEnd" inputmode="numeric" pattern="[0-9]*" value="${v(s.endPage)}" placeholder="—"></label>
        </div>
        <div id="pagesRead"></div>
        <div class="field-hint" id="pagesHint"></div>
      </div>` : ''}
      <div class="field"><span>Time <small style="font-weight:600;color:var(--violet-muted)">(minutes)</small></span>
        <div class="stepper">
          <button class="press" data-action="dur" data-d="-5" aria-label="Minus 5 minutes">−5</button>
          <button class="press" data-action="dur" data-d="-1" aria-label="Minus 1 minute">−1</button>
          <div class="stepper-wrap"><input class="input" id="fMin" inputmode="numeric" pattern="[0-9]*" aria-label="Minutes"></div>
          <button class="press" data-action="dur" data-d="1" aria-label="Plus 1 minute">+1</button>
          <button class="press" data-action="dur" data-d="5" aria-label="Plus 5 minutes">+5</button>
        </div>
        <div class="field-hint" id="durHint"></div>
      </div>
      <label class="field"><span>Note <small style="font-weight:600;color:var(--violet-muted)">(optional)</small></span>
        <textarea class="input" id="fNote" rows="2" placeholder="A line you loved, a thought…">${esc(s.note)}</textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn-danger-text press" data-action="${s.mode === 'edit' ? 'delete' : 'discard'}">${s.mode === 'edit' ? 'Delete' : 'Discard'}</button>
        <button class="btn btn-violet press" data-action="save">${icon('check')}Save</button>
      </div>`;
    updateDur();
    updateChips();
    if (s.type === 'book') { maybePrefill(); updatePages(); }
  }

  function updateDur() {
    const s = ui.sheet;
    const inp = $('#fMin');
    if (document.activeElement !== inp) inp.value = Math.round(s.durMs / C.MIN);
    const exact = s.durMs % C.MIN ? ` (${C.fmtClock(s.durMs)})` : '';
    $('#durHint').textContent = s.durMs > 0 ? `${C.fmtDur(s.durMs)}${exact}` : 'Add some time to save this.';
  }
  function readPage(id) {
    const el = $(id);
    if (!el || el.value.trim() === '') return null;
    const n = parseInt(el.value, 10);
    return Number.isFinite(n) && n >= 0 ? n : null;
  }
  function updatePages() {
    const s = ui.sheet;
    s.startPage = readPage('#fStart'); s.endPage = readPage('#fEnd');
    const pr = C.pagesRead(s.startPage, s.endPage);
    const bad = Number.isFinite(s.startPage) && Number.isFinite(s.endPage) && s.endPage < s.startPage;
    $('#pagesRead').innerHTML = pr !== null ? `<span class="pages-read">${pr === 1 ? '1 page' : `${pr} pages`} read</span>` : '';
    const hint = $('#pagesHint');
    hint.classList.toggle('error', bad);
    hint.textContent = bad ? 'End page is before the start page.' : s.prefillNote || '';
  }
  function maybePrefill() {
    const s = ui.sheet;
    if (s.type !== 'book' || s.startTouched) return;
    const last = C.prefillStartPage(data, s.title, s.id);
    const el = $('#fStart');
    el.value = last !== null ? last : '';
    s.prefillNote = last !== null ? `Picked up where you left off (p. ${last}).` : '';
    updatePages();
  }
  function updateChips() {
    const s = ui.sheet;
    const q = C.normTitle(s.title);
    let items;
    if (s.type === 'book') {
      const stats = C.bookStats(data);
      items = data.books.filter((b) => !b.archived)
        .sort((a, b) => (stats[b.id].lastReadAt || b.createdAt) - (stats[a.id].lastReadAt || a.createdAt))
        .map((b) => ({ title: b.title, extra: stats[b.id].lastPage !== null ? `p. ${stats[b.id].lastPage}` : '' }));
    } else {
      items = C.recentTitles(data.sessions, s.type, 8).map((t) => ({ title: t, extra: '' }));
    }
    const exact = items.some((i) => C.normTitle(i.title) === q);
    if (q && !exact) items = items.filter((i) => C.normTitle(i.title).includes(q));
    items = items.slice(0, 8);
    $('#chips').innerHTML = items.map((i) => `<button class="chip press" data-action="chip" data-title="${esc(i.title)}" aria-pressed="${C.normTitle(i.title) === q}">${esc(i.title)}${i.extra ? `<small>${esc(i.extra)}</small>` : ''}</button>`).join('');
    const hint = $('#titleHint');
    hint.classList.remove('error');
    hint.textContent = s.type === 'book' && q && !C.findBook(data, s.title) ? 'New book — it’ll be added to your shelf.' : '';
  }

  function saveLog() {
    const s = ui.sheet;
    s.title = $('#fTitle').value.trim();
    s.note = $('#fNote').value.trim();
    if (s.type === 'book') updatePages();
    if (!s.title) {
      const f = $('#titleField');
      f.classList.add('err', 'shake');
      setTimeout(() => f.classList.remove('shake'), 450);
      const h = $('#titleHint'); h.textContent = 'Give it a title first.'; h.classList.add('error');
      $('#fTitle').focus();
      return;
    }
    if (!(s.durMs > 0)) { toast('Add at least a minute of time.'); return; }
    if (s.type === 'book' && Number.isFinite(s.startPage) && Number.isFinite(s.endPage) && s.endPage < s.startPage) { toast('Check your pages — end is before start.'); return; }
    const now = Date.now();
    // Today's total before this save (a finished chunk is still in the paused timer, so leave it out).
    const prevTotal = C.todayTotal(data, s.mode === 'finish' ? C.idleTimer() : timer, now);
    const book = s.type === 'book' ? C.upsertBook(data, s.title, now) : null;
    const fields = {
      type: s.type, title: book ? book.title : s.title, bookId: book ? book.id : null,
      startPage: book ? s.startPage : null, endPage: book ? s.endPage : null, note: s.note, durationMs: s.durMs,
    };
    if (s.mode === 'edit') {
      const ex = data.sessions.find((x) => x.id === s.id);
      if (ex) {
        Object.assign(ex, fields);
        if (s.durMs !== s.origDur) ex.alloc = C.scaleAlloc(ex.alloc, s.durMs, C.sessionDay(ex));
      }
      toast('Updated ✓');
    } else {
      let alloc, startedAt, endedAt;
      if (s.mode === 'finish') {
        alloc = s.durMs === s.origDur ? s.alloc : C.scaleAlloc(s.alloc, s.durMs, C.dayKey(s.endedAt));
        startedAt = s.startedAt; endedAt = s.endedAt;
        timer = C.idleTimer(); persistTimer();
      } else {
        alloc = { [C.dayKey(now)]: s.durMs }; startedAt = now - s.durMs; endedAt = now;
      }
      data.sessions.push({ id: C.uid(), ...fields, alloc, startedAt, endedAt });
      toast(s.mode === 'finish' ? 'Logged! Lovely reading. 📚' : 'Added ✓');
    }
    persist();
    closeSheets();
    ui.sheet = null;
    renderAll();
    checkGoal(s.mode === 'edit' ? undefined : prevTotal);
  }

  // ---------- settings ----------
  function renderSettings() {
    const last = data.settings.lastExport;
    const ago = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const lastTxt = last === null ? 'You haven’t made a backup yet.' : ago === 0 ? 'Last backup: today.' : `Last backup: ${ago} day${ago === 1 ? '' : 's'} ago.`;
    $('#settingsSheet').innerHTML = `
      <div class="grabber"></div>
      <div class="sheet-head"><div><h2 id="settingsTitle">Settings</h2><p>Tune your goal, keep your data safe.</p></div>
        <button class="close-btn press" data-action="close-settings" aria-label="Close">${icon('x')}</button></div>
      <div class="field"><span>Daily goal <small style="font-weight:600;color:var(--violet-muted)">(minutes)</small></span>
        <div class="stepper">
          <button class="press" data-action="goal" data-d="-15" aria-label="Minus 15 minutes">−15</button>
          <button class="press" data-action="goal" data-d="-5" aria-label="Minus 5 minutes">−5</button>
          <div class="stepper-wrap"><input class="input" id="fGoal" inputmode="numeric" pattern="[0-9]*" value="${data.settings.goalMin}" aria-label="Daily goal in minutes"></div>
          <button class="press" data-action="goal" data-d="5" aria-label="Plus 5 minutes">+5</button>
          <button class="press" data-action="goal" data-d="15" aria-label="Plus 15 minutes">+15</button>
        </div>
      </div>
      <div class="setting-row"><div><h3>Export backup</h3><p>${esc(lastTxt)}</p></div>
        <button class="btn btn-violet btn-sm press" data-action="export">Export</button></div>
      <div class="setting-row"><div><h3>Import backup</h3><p>Replaces everything with a .json backup.</p></div>
        <button class="btn btn-soft btn-sm press" data-action="import">Import</button></div>
      <div class="note-box">Your reading lives only on this phone, inside this app. Export a backup now and then (save it to Files or iCloud Drive) so you never lose it.</div>
      <p style="text-align:center;color:var(--violet-muted);font-size:13px;font-weight:600;margin:18px 0 0">Reading Log · data v${C.SCHEMA} · ${data.sessions.length} session${data.sessions.length === 1 ? "" : "s"} · ${data.books.length} book${data.books.length === 1 ? "" : "s"}</p>`;
  }
  function setGoal(min) {
    const g = Math.max(5, Math.min(600, Math.round(min) || 60));
    data.settings.goalMin = g;
    persist();
    const el = $('#fGoal');
    if (el && document.activeElement !== el) el.value = g;
    renderAll();
  }
  async function exportData() {
    const now = Date.now();
    const json = C.exportJSON(data, now);
    const name = `reading-log-backup-${C.dayKey(now)}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    let done = false;
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Reading log backup' });
        done = true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // user closed the share sheet
    }
    if (!done) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    data.settings.lastExport = now;
    persist();
    renderSettings();
    toast('Backup ready ✓');
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let next;
      try { next = C.importJSON(String(reader.result)); } catch (e) { toast(e.message); return; }
      const msg = `Replace everything with this backup?\n\n${next.sessions.length} sessions, ${next.books.length} books.\nYour current data (${data.sessions.length} sessions) will be replaced.`;
      if (!confirm(msg)) return;
      data = next;
      persist();
      renderSettings();
      renderAll();
      toast('Backup restored ✓');
    };
    reader.onerror = () => toast('Couldn’t read that file.');
    reader.readAsText(file);
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action],[data-tab]');
    if (!el) return;
    if (el.dataset.tab) { setTab(el.dataset.tab); return; }
    const a = el.dataset.action;
    const now = Date.now();
    switch (a) {
      case 'start': case 'resume':
        timer = C.start(timer, now); persistTimer(); lastTickTotal = undefined; renderToday(); break;
      case 'pause':
        timer = C.pause(timer, now); persistTimer(); renderToday(); break;
      case 'finish':
        timer = C.pause(timer, now); persistTimer(); renderToday(); openLog('finish'); break;
      case 'manual': openLog('manual'); break;
      case 'edit': {
        const s = data.sessions.find((x) => x.id === el.dataset.id);
        if (s) openLog('edit', s);
        break;
      }
      case 'type': {
        const s = ui.sheet;
        s.title = $('#fTitle').value; s.note = $('#fNote').value;
        if (s.type === 'book') updatePages();
        s.type = el.dataset.type;
        if (s.mode !== 'edit') s.startTouched = false;
        renderLogSheet();
        break;
      }
      case 'chip':
        ui.sheet.title = el.dataset.title; $('#fTitle').value = el.dataset.title;
        if (ui.sheet.mode !== 'edit') ui.sheet.startTouched = false;
        updateChips(); maybePrefill();
        $('#titleField').classList.remove('err');
        if (ui.sheet.type === 'book') { const end = $('#fEnd'); if (end && !end.value) end.focus(); }
        break;
      case 'dur': {
        const s = ui.sheet;
        const base = Math.round(s.durMs / C.MIN) * C.MIN;
        s.durMs = Math.max(0, base + Number(el.dataset.d) * C.MIN);
        updateDur();
        break;
      }
      case 'save': saveLog(); break;
      case 'discard':
        if (confirm(ui.sheet.mode === 'finish' ? 'Discard this reading chunk? The time won’t be saved.' : 'Discard this entry?')) {
          if (ui.sheet.mode === 'finish') { timer = C.idleTimer(); persistTimer(); }
          closeSheets(); ui.sheet = null; renderAll(); toast('Discarded');
        }
        break;
      case 'delete':
        if (confirm('Delete this session? This can’t be undone.')) {
          data.sessions = data.sessions.filter((x) => x.id !== ui.sheet.id);
          persist(); closeSheets(); ui.sheet = null; renderAll(); toast('Deleted');
        }
        break;
      case 'close-log': case 'scrim': {
        const wasFinish = ui.sheet && ui.sheet.mode === 'finish';
        closeSheets(); ui.sheet = null;
        if (wasFinish) toast('Timer paused — finish whenever you’re ready.');
        break;
      }
      case 'open-settings': renderSettings(); openSheet($('#settingsSheet')); break;
      case 'close-settings': closeSheets(); break;
      case 'goal': setGoal(data.settings.goalMin + Number(el.dataset.d)); break;
      case 'export': exportData(); break;
      case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
      case 'archive': case 'unarchive': {
        const b = data.books.find((x) => x.id === el.dataset.id);
        if (b) { b.archived = a === 'archive'; persist(); renderBooks(); toast(b.archived ? 'Archived — find it at the bottom.' : 'Back on your shelf ✓'); }
        break;
      }
      case 'toggle-archived': ui.archivedOpen = !ui.archivedOpen; renderBooks(); break;
    }
  });

  document.addEventListener('input', (e) => {
    const s = ui.sheet;
    switch (e.target.id) {
      case 'fTitle':
        s.title = e.target.value; $('#titleField').classList.remove('err');
        updateChips(); maybePrefill(); break;
      case 'fStart': s.startTouched = true; s.prefillNote = ''; updatePages(); break;
      case 'fEnd': updatePages(); break;
      case 'fMin': {
        const n = parseInt(e.target.value, 10);
        s.durMs = Number.isFinite(n) && n >= 0 ? n * C.MIN : 0;
        updateDur(); break;
      }
      case 'fGoal': {
        const n = parseInt(e.target.value, 10);
        if (Number.isFinite(n) && n >= 5) setGoal(n);
        break;
      }
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'fGoal') { setGoal(parseInt(e.target.value, 10)); e.target.value = data.settings.goalMin; }
    if (e.target.id === 'fMin') updateDur();
    if (e.target.id === 'importFile' && e.target.files[0]) importData(e.target.files[0]);
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'addBookForm') return;
    e.preventDefault();
    const inp = $('#newBook');
    const t = inp.value.trim();
    if (!t) return;
    const existed = C.findBook(data, t);
    C.upsertBook(data, t, Date.now());
    persist(); renderBooks();
    toast(existed ? 'Already on your shelf ✓' : 'Added to your shelf 📚');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('.sheet.open')) $('[data-action^="close-"]', $('.sheet.open')).click();
  });

  // Returning to the app (after a lock / backgrounding): re-sync from storage & clock.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { timer = C.loadTimer(storage); renderAll(); }
  });
  window.addEventListener('pageshow', renderAll);
  // Another tab changed the data.
  window.addEventListener('storage', (e) => {
    if (e.key === C.KEY) { data = C.loadData(storage).data; renderAll(); }
    if (e.key === C.TIMER_KEY) { timer = C.loadTimer(storage); renderAll(); }
  });

  // ---------- boot ----------
  const loaded = C.loadData(storage);
  data = loaded.data;
  timer = C.loadTimer(storage);
  renderAll();
  if (loaded.warning) setTimeout(() => toast(loaded.warning), 600);
  setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 250);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
