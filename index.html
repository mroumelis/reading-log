<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F4">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Read.Log">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/vt323-400.woff2" as="font" type="font/woff2" crossorigin>
<title>READ.LOG</title>
<script>
// Apply the saved accent before first paint (no flash). Keep in sync with ACCENTS below.
(function () {
  var A = { yellow: '#E3B04B', green: '#9BBC0F', blue: '#7DA7D9', red: '#D9604F', mono: '#8A8A8A' };
  var id = 'green';
  try { var v = localStorage.getItem('readlog.accent'); if (A[v]) id = v; } catch (e) {}
  document.documentElement.style.setProperty('--accent', A[id]);
  document.documentElement.setAttribute('data-accent', id);
})();
</script>
<style>
@font-face { font-family: "Silkscreen"; src: url("fonts/silkscreen-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: "VT323"; src: url("fonts/vt323-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
:root {
  --ink: #111111;
  --paper: #F4F4F4;
  --mid: #D6D6D6;
  --gray: #8A8A8A;
  --dim: #555555;
  --label: #C8C8C8;
  --accent: #9BBC0F; /* overwritten before first paint from readlog.accent */
  --pixel: "Silkscreen", ui-monospace, Menlo, monospace;
  --term: "VT323", ui-monospace, Menlo, monospace;
  --n4: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  --n2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --tab-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body {
  background-color: var(--paper);
  background-image: conic-gradient(var(--mid) 25%, var(--paper) 0 50%, var(--mid) 0 75%, var(--paper) 0);
  background-size: 4px 4px;
}
body { margin: 0; color: var(--ink); font: 22px/1.15 var(--term); min-height: 100dvh; overscroll-behavior-y: none; -webkit-font-smoothing: none; }
body.locked { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
svg { display: block; }
[hidden] { display: none !important; }
.ico { flex: none; }

.app { max-width: 520px; margin: 0 auto; padding: calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + var(--tab-h) + 28px) calc(var(--sl) + 16px); }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-sq { width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--ink); flex: none; }
.logo-txt { font: 700 20px/1 var(--pixel); }
.date { font: 24px/1 var(--term); white-space: nowrap; }

/* ---------- stepped (notched) boxes: ink outer w/ 4px notch, fill inner w/ 2px notch ---------- */
.bo { display: block; background: var(--ink); padding: 2px; clip-path: var(--n4); }
.bi { display: block; background: var(--paper); clip-path: var(--n2); }

/* windows */
.win { filter: drop-shadow(4px 4px 0 var(--ink)); margin: 0 4px 26px 0; }
.tb {
  position: relative; height: 26px; padding: 5px 4px; border-bottom: 2px solid var(--ink);
  background: repeating-linear-gradient(to bottom, var(--ink) 0 2px, var(--paper) 2px 4px) content-box, var(--paper);
  display: flex; align-items: center; justify-content: center;
}
.tb-label { background: var(--paper); padding: 0 8px; font: 700 13px/16px var(--pixel); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 72px); display: flex; align-items: center; gap: 6px; }
.tb-box { position: absolute; left: 8px; top: 4px; width: 16px; height: 16px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--paper); }
.tb-close { position: absolute; left: 0; top: 0; width: 48px; height: 24px; }
.tb-close::after { content: ""; position: absolute; left: 8px; top: 4px; width: 16px; height: 16px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--paper); }
.tb-close:active::after { background: var(--ink); }
.wb { padding: 16px; }
.wb.flush { padding: 0; }

/* buttons */
.btn { display: block; width: 100%; filter: drop-shadow(4px 4px 0 var(--ink)); transition: transform .12s steps(1), filter .12s steps(1); }
.btn .bi { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; font: 700 16px/1 var(--pixel); text-transform: uppercase; white-space: nowrap; }
.btn.primary { filter: drop-shadow(4px 4px 0 var(--gray)); }
.btn.primary .bi { background: var(--accent); color: var(--ink); }
.btn.dark .bi { background: var(--ink); color: var(--paper); }
.btn:active { transform: translate(2px, 2px); filter: drop-shadow(2px 2px 0 var(--ink)); }
.btn.primary:active { filter: drop-shadow(2px 2px 0 var(--gray)); }
.btn.sm .bi { min-height: 40px; font-size: 13px; padding: 0 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; margin-right: 4px; }
.link { display: block; margin: 20px auto 0; min-height: 44px; padding: 0 12px; font: 700 13px/44px var(--pixel); text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-align: center; }

/* segmented control */
.seg { filter: drop-shadow(4px 4px 0 var(--ink)); margin-right: 4px; }
.seg .bi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--ink); }
.seg button { min-height: 44px; background: var(--paper); font: 700 14px/1 var(--pixel); text-transform: uppercase; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--accent); }
.seg button:active { background: var(--mid); }

/* fields */
.lbl { display: block; font: 700 13px/1 var(--pixel); text-transform: uppercase; color: var(--dim); margin: 20px 0 8px; }
.lbl.first { margin-top: 0; }
.field { filter: drop-shadow(4px 4px 0 var(--ink)); margin-right: 4px; }
.field .bi { display: flex; }
.field:focus-within .bi { box-shadow: inset 0 0 0 2px var(--ink); }
.field input, .field textarea { width: 100%; min-height: 44px; border: 0; background: transparent; padding: 8px 12px; font: 22px/1.1 var(--term); outline: none; appearance: none; -webkit-appearance: none; border-radius: 0; }
.field textarea { min-height: 72px; resize: none; display: block; }
.field input::placeholder, .field textarea::placeholder { color: var(--gray); }
.shake { animation: shake .36s steps(4); }
@keyframes shake { 0%, 50% { transform: translateX(-4px); } 25%, 75% { transform: translateX(4px); } 100% { transform: none; } }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.chip { max-width: calc(100% - 4px); filter: drop-shadow(2px 2px 0 var(--ink)); transition: transform .1s steps(1); }
.chip .bi { background: var(--mid); min-height: 40px; padding: 0 12px; font: 22px/40px var(--term); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.on .bi { background: var(--accent); }
.chip:active { transform: translate(2px, 2px); }
.chip.new { filter: none; }
.chip.new .bo { background: none; padding: 0; }
.chip.new .bi { background: var(--paper); border: 2px dashed var(--ink); min-height: 44px; font: 700 13px/40px var(--pixel); }
.pickup { margin-top: 16px; font: 700 13px/1.5 var(--pixel); text-transform: uppercase; min-height: 20px; }
.pickup b { background: var(--accent); padding: 0 4px; }
.mt { margin-top: 22px; margin-right: 4px; }

/* scene */
.scene { position: relative; height: 100px; border-bottom: 2px solid var(--ink); margin: 0 0 20px; }
.mouse { position: absolute; left: 24px; bottom: 0; }
.mouse.bob { animation: bob 1s steps(1) infinite; }
.mouse.hop { animation: hop .5s steps(1) infinite; }
@keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes hop { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.shelf { position: absolute; right: 8px; bottom: 0; }
.zz { position: absolute; left: 112px; top: 0; font: 700 13px/1 var(--pixel); }
.zz span { position: absolute; animation: blink 1.6s steps(1) infinite; }
.zz span:nth-child(1) { left: 0; top: 20px; }
.zz span:nth-child(2) { left: 14px; top: 4px; animation-delay: .8s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
.spark { position: absolute; animation: blink .5s steps(1) infinite; }
.spark.a { left: 2px; top: 6px; }
.spark.b { left: 112px; top: 22px; animation-delay: .25s; }
.scene-cap { position: absolute; left: 140px; top: 26px; font: 700 13px/1.3 var(--pixel); text-transform: uppercase; }

/* now reading */
.now-title { font: 32px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }
.meta { font: 22px/1.1 var(--term); color: var(--dim); text-transform: uppercase; margin-top: 4px; }

/* CRT */
.crt { filter: drop-shadow(4px 4px 0 var(--gray)); margin: 20px 4px 24px 0; }
.crt .bi {
  background-color: var(--ink);
  background-image: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px);
  color: var(--accent); padding: 12px 14px;
}
.crt-top, .crt-bot { display: flex; justify-content: space-between; gap: 8px; font: 700 13px/1 var(--pixel); color: var(--label); text-transform: uppercase; }
.crt-bot { justify-content: center; margin-top: 4px; }
.crt-digits { font: 96px/1 var(--term); text-align: center; margin: 10px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.crt-digits.long { font-size: 80px; }
.crt-digits.sm { font-size: 56px; margin: 8px 0 0; }
.rec { color: var(--accent); animation: blink 1.2s steps(1) infinite; }
.crt-digits.held { animation: blink 1.2s steps(1) infinite; }
.run-btns { margin-top: 0; }

/* pages */
.pages-sum { margin-top: 16px; font: 24px/1 var(--term); text-transform: uppercase; }
.mat { font: 30px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }

/* log rows */
.row { display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 48px; padding: 12px 0; border-bottom: 2px dotted var(--gray); font: 22px/1.1 var(--term); }
.rows > :last-child { border-bottom: 0; }
.row:active { background: var(--mid); }
.row .t, .row .pg { color: var(--dim); white-space: nowrap; flex: none; }
.row .name { text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.row .lead { flex: 1 1 12px; min-width: 12px; border-bottom: 2px dotted var(--ink); transform: translateY(-6px); }
.row .min { white-space: nowrap; flex: none; }
.row-note { display: block; color: var(--dim); font-size: 20px; padding: 0 0 12px; margin-top: -6px; border-bottom: 2px dotted var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.has-note { border-bottom: 0; }
.empty { padding: 4px 0; color: var(--dim); font: 22px/1.2 var(--term); text-transform: uppercase; }
.flush .rows { padding: 0 16px; }
.flush .empty { padding: 16px; }

/* history */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wbox { width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 2px 2px 0 var(--ink); }
.wbox.hit { background: var(--accent); }
.wbox.part { background-color: var(--paper); background-image: conic-gradient(var(--accent) 25%, var(--paper) 0 50%, var(--accent) 0 75%, var(--paper) 0); background-size: 8px 8px; }
.wl { font: 700 13px/18px var(--pixel); width: 22px; text-align: center; }
.wl.today { background: var(--ink); color: var(--accent); }
.stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-top: 18px; padding-top: 14px; border-top: 2px dotted var(--gray); font: 24px/1.1 var(--term); text-transform: uppercase; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font: 700 11px/14px var(--pixel); text-transform: uppercase; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border: 2px solid var(--ink); display: inline-block; background: var(--paper); }
.legend i.hit { background: var(--accent); }
.legend i.part { background-image: conic-gradient(var(--accent) 25%, var(--paper) 0 50%, var(--accent) 0 75%, var(--paper) 0); background-size: 4px 4px; }
.dayhdr { display: flex; justify-content: space-between; gap: 10px; background: var(--ink); color: var(--paper); padding: 6px 16px; font: 22px/1 var(--term); text-transform: uppercase; }
.dayhdr b { color: var(--accent); font-weight: 400; white-space: nowrap; }

/* books */
.addbook { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.addbook .btn { width: auto; }
.brow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 2px dotted var(--gray); }
.brow:last-child { border-bottom: 0; }
.brow-main { flex: 1; min-width: 0; }
.brow-title { font: 26px/1 var(--term); text-transform: uppercase; overflow-wrap: anywhere; }
.brow.archived .brow-title { color: var(--dim); }
.brow .btn { width: auto; flex: none; margin-right: 4px; }

/* stepper */
.stepper { display: grid; grid-template-columns: 48px 48px 1fr 48px 48px; gap: 10px; align-items: center; margin-right: 4px; }
.stepper .btn .bi { padding: 0; font-size: 13px; min-height: 44px; }
.stepper .field { margin-right: 0; }
.stepper input { text-align: center; font-size: 28px; }
.note { margin-top: 20px; padding: 12px; background: var(--ink); color: var(--paper); font: 22px/1.15 var(--term); }
.note b { color: var(--accent); font-weight: 400; }
.small { font: 20px/1.2 var(--term); color: var(--dim); margin-top: 12px; text-transform: uppercase; }

/* modal */
.ov {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
  background-image: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0); background-size: 4px 4px;
  padding: calc(var(--st) + 12px) calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px);
}
.ov > div { width: 100%; max-width: 520px; max-height: calc(100dvh - var(--st) - var(--sb) - 24px); display: flex; }
.ov .win { width: 100%; margin: 0 4px 4px 0; display: flex; }
.ov .win > .bo { width: 100%; display: flex; }
.ov .win > .bo > .bi { width: 100%; display: flex; flex-direction: column; min-height: 0; }
.ov .wb { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 2px solid var(--ink); padding: 0 var(--sr) var(--sb) var(--sl); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 520px; margin: 0 auto; height: var(--tab-h); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 10px/1 var(--pixel); text-transform: uppercase; position: relative; }
.tab .ib { height: 24px; display: grid; place-items: center; }
.tab + .tab { border-left: 2px solid var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--accent); }
.tab .live { position: absolute; top: 8px; right: calc(50% - 24px); width: 8px; height: 8px; background: var(--accent); border: 2px solid var(--ink); box-sizing: content-box; animation: blink 1.2s steps(1) infinite; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + var(--tab-h) + 22px); z-index: 50; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 40px); pointer-events: none; filter: drop-shadow(4px 4px 0 var(--gray)); visibility: hidden; }
.toast .bi { background: var(--ink); color: var(--paper); padding: 10px 14px; font: 700 13px/1.4 var(--pixel); text-transform: uppercase; text-align: center; }
.toast.show { visibility: visible; }

/* manual entries, day headers, entry form */
.tag { flex: none; align-self: center; background: var(--ink); color: var(--paper); font: 700 8px/1 var(--pixel); text-transform: uppercase; padding: 4px 4px 3px; }
.row { flex-wrap: wrap; }
.row .pg { flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; margin-top: 2px; }
.row .tag + .name, .row .t + .name { max-width: calc(100% - 120px); }
.dayhdr { align-items: center; min-height: 44px; padding: 0 0 0 16px; }
.dh-date { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh-add { flex: none; width: 48px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.dh-add span { width: 24px; height: 24px; background: var(--paper); display: grid; place-items: center; clip-path: var(--n2); }
.dh-add:active span { background: var(--accent); }
.mb { margin: 0 4px 22px 0; }
.mt0 { margin-top: 20px; }
.stepper3 { display: grid; grid-template-columns: 52px 1fr 52px; gap: 12px; align-items: center; margin-right: 4px; }
.stepper3 .btn .bi { padding: 0; min-height: 44px; }
.stepper3 .field { margin-right: 0; }
.stepper3 input, .out { text-align: center; font-size: 28px; }
.out { display: block; width: 100%; min-height: 44px; line-height: 44px; font-family: var(--term); }
[data-hold] { -webkit-touch-callout: none; touch-action: none; }
.field input[type="date"] { display: block; min-height: 44px; line-height: 28px; text-transform: uppercase; }
.field input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.field input[type="date"]::-webkit-calendar-picker-indicator { opacity: .6; }
.sum-err { display: block; margin-top: 8px; background: var(--ink); color: var(--accent); padding: 4px 8px; font-size: 20px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; }
.sum-hint { display: block; margin-top: 8px; color: var(--dim); font-size: 20px; }
.stack { display: grid; gap: 14px; margin: 18px 4px 0 0; }
.small b { color: var(--ink); font-weight: 400; text-decoration: underline; }

/* settings */
.help { font: 700 11px/1.5 var(--pixel); text-transform: uppercase; color: var(--dim); }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 16px 4px 0 0; }
.tile { display: block; min-width: 0; filter: drop-shadow(2px 2px 0 var(--ink)); transition: transform .1s steps(1); }
.tile:active { transform: translate(2px, 2px); }
.tile .bi { background: var(--mid); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 3px 6px; }
.tile svg { display: block; }
.swatch { display: block; width: 100%; height: 22px; border: 2px solid var(--ink); }
.tile-lbl { font: 700 9px/1 var(--pixel); text-transform: uppercase; padding: 3px 2px 2px; }
.tile.on { filter: drop-shadow(3px 3px 0 var(--ink)); }
.tile.on > .bo { padding: 3px; }
.tile.on .bi { background: var(--paper); }
.tile.on .tile-lbl { background: var(--ink); color: var(--paper); }
.preview { display: flex; align-items: flex-end; gap: 18px; border-bottom: 2px solid var(--ink); margin-right: 4px; }
.preview .btn { flex: 1; margin-bottom: 18px; pointer-events: none; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px; padding: 10px 0; border-bottom: 2px dotted var(--gray); }
.prow:last-of-type { border-bottom: 0; }
.pl { font: 700 11px/1.3 var(--pixel); text-transform: uppercase; }
.pctl { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
.pctl .btn { width: 40px; }
.pctl .btn .bi { min-height: 40px; padding: 0; }
.pv { min-width: 78px; text-align: center; font: 24px/1 var(--term); white-space: nowrap; }
.prow > .btn { width: auto; margin-right: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo"><span class="logo-sq" aria-hidden="true"></span><span class="logo-txt">READ.LOG</span></div>
    <div class="date" id="date"></div>
  </header>
  <main>
    <div id="view-today">
      <div id="home"></div>
      <div id="todayLog"></div>
    </div>
    <div id="view-history" hidden></div>
    <div id="view-books" hidden></div>
    <div id="view-settings" hidden></div>
  </main>
</div>

<div class="ov" id="ov" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>

<script>
/*CORE-START*/
// Pure, DOM-free logic. Everything time-related takes `now` explicitly so it can be tested.
(function (root) {
  'use strict';
  const SCHEMA = 2;
  const KEY = 'readinglog.data';
  const TIMER_KEY = 'readinglog.timer';
  const TYPES = ['book', 'article', 'poem'];
  const MIN = 60000;
  const DEFAULT_DAY_START = 3;
  const DAY_RE = /^\d{4}-\d\d-\d\d$/;

  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ----- dates (always the device's local time zone) -----
  function dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function parseDay(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(key, n) {
    const d = parseDay(key);
    d.setDate(d.getDate() + n);
    return dayKey(d.getTime());
  }
  const isDay = (s) => typeof s === 'string' && DAY_RE.test(s) && dayKey(parseDay(s).getTime()) === s;
  // The "logical" day: before `startHour` on the local clock still counts as the previous date.
  // Reads the local wall-clock hour, so it's DST-safe (no fixed 3×3600 s subtraction).
  function logicalDay(ts, startHour) {
    const h = startHour === undefined ? DEFAULT_DAY_START : startHour;
    const d = new Date(ts);
    if (d.getHours() < h) {
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() - 1);
    }
    return dayKey(d.getTime());
  }
  const dayStart = (data) => (data && data.settings && Number.isInteger(data.settings.dayStart) ? data.settings.dayStart : DEFAULT_DAY_START);
  const today = (data, now) => logicalDay(now, dayStart(data));

  // ----- timer (timestamp based) -----
  // { status: 'idle'|'running'|'hold'|'paused', segments: [{start,end}], runStart: ts|null, material?: {type,title,fromPage} }
  // 'hold'   = PAUSED mid-reading: nothing counts until RESUME; the session isn't over.
  // 'paused' = STOPPED: the session is over and waiting to be saved or discarded.
  //            (The name is kept so timers saved by older versions still load.)
  const idleTimer = () => ({ status: 'idle', segments: [], runStart: null });
  function start(t, now, material) {
    if (t.status === 'running') return t;
    const out = { status: 'running', segments: t.segments.slice(), runStart: now };
    const m = material || t.material;
    if (m) out.material = m;
    return out;
  }
  function pause(t, now) {
    if (t.status !== 'running') return t;
    const end = Math.max(now, t.runStart); // guard against the clock going backwards
    const segments = t.segments.concat(end > t.runStart ? [{ start: t.runStart, end }] : []);
    const out = { status: 'paused', segments, runStart: null };
    if (t.material) out.material = t.material;
    return out;
  }
  // PAUSE while reading: close the current run, keep the session open.
  function hold(t, now) {
    if (t.status !== 'running') return t;
    return Object.assign(pause(t, now), { status: 'hold' });
  }
  // STOP works from running or paused.
  function stop(t, now) {
    if (t.status === 'running') return pause(t, now);
    if (t.status === 'hold') return Object.assign({}, t, { status: 'paused', segments: t.segments.slice() });
    return t;
  }
  function segmentsAt(t, now) {
    if (t.status !== 'running') return t.segments;
    return t.segments.concat([{ start: t.runStart, end: Math.max(now, t.runStart) }]);
  }
  function elapsed(t, now) {
    return segmentsAt(t, now).reduce((s, g) => s + (g.end - g.start), 0);
  }
  function timerStart(t) {
    return t.segments.length ? t.segments[0].start : t.status === 'running' ? t.runStart : null;
  }
  // What gets saved when you stop a chunk.
  function draftFromTimer(t, now) {
    const segs = segmentsAt(t, now);
    return {
      durationMs: elapsed(t, now),
      startedAt: segs.length ? segs[0].start : now,
      endedAt: segs.length ? segs[segs.length - 1].end : now,
    };
  }

  // ----- days, totals, streaks -----
  // Timed sessions belong to the logical day they STARTED (never split); manual entries keep their stored date.
  function sessionDay(s, startHour) {
    return s.manual ? s.date : logicalDay(s.startedAt, startHour);
  }
  function dayTotals(data, timer, now) {
    const h = dayStart(data);
    const out = {};
    for (const s of data.sessions) { const k = sessionDay(s, h); out[k] = (out[k] || 0) + s.durationMs; }
    if (timer && timer.status !== 'idle') {
      const st = timerStart(timer);
      if (st !== null) { const k = logicalDay(st, h); out[k] = (out[k] || 0) + elapsed(timer, now); }
    }
    return out;
  }
  function todayTotal(data, timer, now) {
    return dayTotals(data, timer, now)[today(data, now)] || 0;
  }
  function sessionNumber(data, todayKey) {
    const h = dayStart(data);
    return data.sessions.filter((s) => !s.manual && sessionDay(s, h) === todayKey).length + 1;
  }
  // The cheering mouse plays once per day, the first time Home is on screen after the goal is hit.
  function shouldCheer(totalMs, goalMs, cheeredDay, todayKey) {
    return totalMs >= goalMs && cheeredDay !== todayKey;
  }
  // Current streak of days that hit the goal. Today not hitting yet doesn't break it.
  function streak(totals, todayKey, goalMs) {
    let d = todayKey;
    if ((totals[d] || 0) < goalMs) d = addDays(d, -1);
    let n = 0;
    while ((totals[d] || 0) >= goalMs) { n++; d = addDays(d, -1); }
    return n;
  }
  function week(totals, todayKey, goalMs) {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const k = addDays(todayKey, -i);
      const ms = totals[k] || 0;
      out.push({ key: k, ms, hit: ms >= goalMs, today: i === 0 });
    }
    return out;
  }

  // ----- ordering -----
  // Display order within a day: timed sessions by start time, then manual entries in the order added.
  function displayOrder(data, list) {
    const idx = new Map(data.sessions.map((s, i) => [s, i]));
    return list.slice().sort((a, b) =>
      (a.manual - b.manual) || (a.manual ? (a.addedAt - b.addedAt) : (a.startedAt - b.startedAt)) || (idx.get(a) - idx.get(b)));
  }
  // Reading order (for page tracking): logical day, then when it happened. A manual entry has no
  // time of day, so it sits at the moment it was added (backfilled ones at midday); that keeps a
  // past-dated entry after that day's timed sessions, and a timer session tonight after an entry
  // you typed in this afternoon.
  function readingKey(s, h, i) {
    return [sessionDay(s, h), s.manual ? s.addedAt : s.startedAt, i];
  }
  const cmpKey = (a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : (a[1] - b[1]) || (a[2] - b[2]));
  function readingOrder(data) {
    const h = dayStart(data);
    return data.sessions.map((s, i) => ({ s, k: readingKey(s, h, i) })).sort((a, b) => cmpKey(a.k, b.k)).map((x) => x.s);
  }

  // ----- pages: "xi–xxxi, 3–32", "33-79", "40" -----
  const ROMAN = { i: 1, v: 5, x: 10, l: 50, c: 100, d: 500, m: 1000 };
  function intToRoman(n) {
    const t = [[1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'], [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'], [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']];
    let s = '';
    for (const [v, r] of t) while (n >= v) { s += r; n -= v; }
    return s;
  }
  function romanToInt(str) {
    const s = String(str).toLowerCase();
    if (!/^[ivxlcdm]+$/.test(s)) return null;
    let total = 0;
    for (let i = 0; i < s.length; i++) {
      const v = ROMAN[s[i]], n = ROMAN[s[i + 1]] || 0;
      total += v < n ? -v : v;
    }
    return total > 0 && intToRoman(total) === s ? total : null; // rejects "iiii", "vx", …
  }
  function parsePage(tok) {
    const t = tok.trim();
    if (/^\d+$/.test(t)) return { n: Number(t), roman: false };
    const r = romanToInt(t);
    return r === null ? null : { n: r, roman: true };
  }
  function parsePages(text) {
    const out = { ranges: [], errors: [], count: 0, lastArabic: null, empty: true };
    const parts = String(text || '').split(',').map((p) => p.trim()).filter(Boolean);
    out.empty = parts.length === 0;
    for (const p of parts) {
      const bits = p.split(/\s*[-–—]\s*/);
      let a, b;
      if (bits.length === 1) { a = b = parsePage(bits[0]); }
      else if (bits.length === 2) { a = parsePage(bits[0]); b = parsePage(bits[1]); }
      if (!a || !b || a.roman !== b.roman) { out.errors.push(p); continue; }
      if (b.n < a.n) { out.errors.push(p); continue; }
      out.ranges.push({ start: a.n, end: b.n, roman: a.roman });
      out.count += b.n - a.n + 1;
      if (!a.roman) out.lastArabic = b.n;
    }
    return out;
  }
  const prettyPages = (text) => String(text || '').trim().replace(/\s*[-—]\s*/g, '–').replace(/\s*,\s*/g, ', ');
  const pagesCount = (s) => (Number.isFinite(s.pagesOverride) ? s.pagesOverride : Number.isFinite(s.pagesRead) ? s.pagesRead : null);

  // ----- books -----
  const normTitle = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  function findBook(data, title) {
    const n = normTitle(title);
    if (!n) return null;
    return data.books.find((b) => normTitle(b.title) === n) || null;
  }
  function upsertBook(data, title, now) {
    let b = findBook(data, title);
    if (b) { b.archived = false; return b; }
    b = { id: uid(), title: String(title).trim().replace(/\s+/g, ' '), author: '', archived: false, createdAt: now };
    data.books.push(b);
    return b;
  }
  // Last arabic page of a book in reading order. `filter` limits which entries count.
  function lastPage(data, bookId, filter) {
    let last = null;
    for (const s of readingOrder(data)) {
      if (s.type !== 'book' || s.bookId !== bookId || (filter && !filter(s))) continue;
      const p = parsePages(s.pages).lastArabic;
      if (p !== null) last = p;
    }
    return last;
  }
  // Where to pick up: the page after the last arabic page read.
  //  - opts.date: a new manual entry on that date (counts entries on or before it)
  //  - opts.beforeId: editing that entry (counts entries before it in reading order)
  //  - neither: the latest entry overall (timer / Home screen)
  function pickupPage(data, title, opts) {
    const b = findBook(data, title);
    if (!b) return null;
    const h = dayStart(data);
    let filter = null;
    if (opts && opts.beforeId) {
      const i = data.sessions.findIndex((s) => s.id === opts.beforeId);
      if (i >= 0) {
        const ref = readingKey(data.sessions[i], h, i);
        filter = (s) => cmpKey(readingKey(s, h, data.sessions.indexOf(s)), ref) < 0;
      }
    } else if (opts && opts.date) {
      filter = (s) => sessionDay(s, h) <= opts.date;
    }
    const p = lastPage(data, b.id, filter);
    return p === null ? null : p + 1;
  }
  function bookStats(data) {
    const out = {};
    data.books.forEach((b) => { out[b.id] = { totalMs: 0, count: 0, pages: 0, rank: -1, lastPage: null }; });
    readingOrder(data).forEach((s, rank) => {
      const st = s.type === 'book' && out[s.bookId];
      if (!st) return;
      st.totalMs += s.durationMs; st.count++; st.rank = rank;
      st.pages += pagesCount(s) || 0;
      const p = parsePages(s.pages).lastArabic;
      if (p !== null) st.lastPage = p;
    });
    return out;
  }
  function recentTitles(data, type, limit) {
    const seen = new Set(); const out = [];
    for (const s of readingOrder(data).reverse()) {
      if (s.type !== type) continue;
      const n = normTitle(s.title);
      if (!n || seen.has(n)) continue;
      seen.add(n); out.push(s.title);
      if (out.length >= (limit || 8)) break;
    }
    return out;
  }

  // ----- formatting -----
  function fmtDur(ms) {
    if (ms > 0 && ms < MIN) return '<1m';
    const m = Math.floor(ms / MIN), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${m}m`;
  }
  function hms(ms) {
    const s = Math.floor(Math.max(0, ms) / 1000);
    return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60];
  }
  function fmtCRT(ms) { // 05:12 / 1:05:12 — counts up forever, no cap
    const [h, m, s] = hms(ms);
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function fmtHMS(ms) { // 00:38:12
    const [h, m, s] = hms(ms);
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  function fmtHour(h) { // 3 → "3:00 AM"
    return `${h % 12 === 0 ? 12 : h % 12}:00 ${h < 12 ? 'AM' : 'PM'}`;
  }

  // ----- pixel art -----
  // One <rect> per horizontal run of same-coloured cells. `colors` maps grid chars to fills;
  // chars not in the map are transparent.
  function gridRects(rows, colors) {
    const out = [];
    rows.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const c = row[x];
        let w = 1;
        while (row[x + w] === c) w++;
        if (colors[c]) out.push({ x, y, w, fill: colors[c] });
        x += w;
      }
    });
    return out;
  }
  function svgPixels(rows, colors, cell, cls, label) {
    const w = rows[0].length, h = rows.length;
    const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
    return `<svg class="${cls || ''}" viewBox="0 0 ${w} ${h}" width="${w * cell}" height="${h * cell}" shape-rendering="crispEdges" ${a11y}>` +
      gridRects(rows, colors).map((r) => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="1" fill="${r.fill}"/>`).join('') + '</svg>';
  }
  // The mascot: 14×16. Fixed colours for fur/pink; `A` is the accent (only on the book).
  const MOUSE_COLORS = { K: '#111111', G: '#B7B1AC', D: '#8C857F', P: '#F2A9BE', W: '#F4F4F4' };
  const mouseColors = (accent) => Object.assign({}, MOUSE_COLORS, { A: accent });
  const MOUSE = [
    '..KK.....KKK..',
    '.KPPK...KPPPK.',
    '.KPPPKKKPPPPK.',
    '.KPPGGGGGPPPK.',
    '..KGGGGGGKKK..',
    '.KGKGGKGGK....',
    'KPGGGGGGGK..K.',
    'KGGGGGGGK..KPK',
    '.KDDDDDK..KPK.',
    '..KGGGGGK.KPK.',
    '..KGGGGGK.KPK.',
    '.KPGGPGGK..KPK',
    '.KGGGGGGGK.KPK',
    '.KGGGGGGGKKPK.',
    'KPPGGPPGGPPK..',
    'KKKKKKKKKKK...',
  ];
  // Rows 7–15 while reading: an open book seen from behind, cover in the accent.
  const READ_ROWS = [
    'KGGGGGGGK..KPK',
    'KKDDDDDK.KKPK.',
    'KWKKGGGKKWKPK.',
    'GAWWKKKWWAGPK.',
    'GAAAWDWAAAGKPK',
    'KKAAADAAAKKKPK',
    '.KKKADAKKKKPK.',
    'KPPGKKKGGPPK..',
    'KKKKKKKKKKK...',
  ];
  const MOODS = {
    base: [],
    sleep: [[3, 5, 'K'], [4, 5, 'K'], [6, 5, 'K'], [7, 5, 'K']],
    cool: [2, 3, 4, 5, 6, 7, 8].map((x) => [x, 5, 'K'])
      .concat([2, 3, 4, 6, 7, 8].map((x) => [x, 6, 'K']))
      .concat([[3, 5, 'W'], [7, 5, 'W']]),
    read: READ_ROWS.flatMap((row, dy) => row.split('').map((c, x) => [x, 7 + dy, c])),
  };
  function mouseGrid(mood) {
    const g = MOUSE.map((r) => r.split(''));
    for (const [x, y, c] of MOODS[mood] || []) g[y][x] = c; // overrides applied in order
    return g.map((r) => r.join(''));
  }

  // ----- storage -----
  const freshData = () => ({ schema: SCHEMA, settings: { goalMin: 60, dayStart: DEFAULT_DAY_START, lastExport: null }, books: [], sessions: [] });
  const num = (v) => (v === null || v === undefined || v === '' ? null : Number.isFinite(Number(v)) ? Number(v) : null);

  function migrate(obj) {
    if (!obj.schema) obj.schema = 1;
    if (obj.schema > SCHEMA) throw new Error(`This file is from a newer version (schema ${obj.schema}).`);
    // 1 → 2: sessions lose the per-day `alloc` split (they now count for the day they started),
    // and start/end page numbers become a pages text like "42-79".
    if (obj.schema === 1 && Array.isArray(obj.sessions)) {
      for (const s of obj.sessions) {
        if (!s || typeof s !== 'object') continue;
        delete s.alloc;
        if (s.pages === undefined) {
          const a = num(s.startPage), b = num(s.endPage);
          s.pages = a !== null && b !== null ? `${a}-${b}` : b !== null ? `${b}` : '';
        }
        delete s.startPage; delete s.endPage;
      }
      obj.schema = 2;
    }
    return obj;
  }
  function sanitize(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Not a reading log file.');
    obj = migrate(obj);
    const data = freshData();
    const st = obj.settings || {};
    const g = num(st.goalMin);
    data.settings.goalMin = g && g >= 1 && g <= 1440 ? Math.round(g) : 60;
    const ds = num(st.dayStart);
    data.settings.dayStart = Number.isInteger(ds) && ds >= 0 && ds <= 11 ? ds : DEFAULT_DAY_START;
    data.settings.lastExport = num(st.lastExport);
    const seenBooks = new Set();
    for (const b of Array.isArray(obj.books) ? obj.books : []) {
      if (!b || typeof b.title !== 'string' || !b.title.trim()) continue;
      const id = typeof b.id === 'string' && b.id ? b.id : uid();
      if (seenBooks.has(id)) continue;
      seenBooks.add(id);
      data.books.push({ id, title: b.title.trim(), author: typeof b.author === 'string' ? b.author.trim() : '', archived: !!b.archived, createdAt: num(b.createdAt) || 0 });
    }
    const seenSessions = new Set();
    for (const s of Array.isArray(obj.sessions) ? obj.sessions : []) {
      if (!s || typeof s !== 'object') continue;
      const durationMs = num(s.durationMs);
      if (durationMs === null || durationMs < 0) continue;
      const id = typeof s.id === 'string' && s.id ? s.id : uid();
      if (seenSessions.has(id)) continue;
      const type = TYPES.includes(s.type) ? s.type : 'book';
      const pages = type === 'book' && typeof s.pages === 'string' ? s.pages.slice(0, 200) : '';
      const parsed = parsePages(pages);
      const base = {
        id, type, title: typeof s.title === 'string' ? s.title : '',
        bookId: type === 'book' && seenBooks.has(s.bookId) ? s.bookId : null,
        durationMs, pages,
        pagesRead: parsed.ranges.length ? parsed.count : null,
        pagesOverride: type === 'book' && num(s.pagesOverride) !== null && num(s.pagesOverride) >= 0 ? Math.round(num(s.pagesOverride)) : null,
        note: typeof s.note === 'string' ? s.note : '',
      };
      if (s.manual) {
        if (!isDay(s.date)) continue;
        const noon = parseDay(s.date).getTime() + 12 * 3600000;
        data.sessions.push({ ...base, manual: true, date: s.date, startedAt: null, endedAt: null, addedAt: num(s.addedAt) ?? noon });
      } else {
        const endedAt = num(s.endedAt);
        if (endedAt === null) continue;
        const startedAt = num(s.startedAt) ?? endedAt - durationMs;
        data.sessions.push({ ...base, manual: false, date: null, startedAt, endedAt, addedAt: num(s.addedAt) ?? endedAt });
      }
      seenSessions.add(id);
    }
    // Book sessions whose book went missing: re-link by title.
    for (const s of data.sessions) {
      if (s.type === 'book' && !s.bookId && s.title.trim()) s.bookId = upsertBook(data, s.title, s.addedAt).id;
    }
    return data;
  }
  function loadData(storage) {
    let raw = null;
    try { raw = storage.getItem(KEY); } catch (e) { /* storage unavailable */ }
    if (!raw) return { data: freshData() };
    try {
      return { data: sanitize(JSON.parse(raw)) };
    } catch (e) {
      try { storage.setItem(`${KEY}.corrupt.${Date.now()}`, raw); } catch (_) {}
      return { data: freshData(), warning: 'Saved data looked damaged, so it was set aside. Import a backup to restore.' };
    }
  }
  function saveData(storage, data) {
    storage.setItem(KEY, JSON.stringify(data));
  }
  function cleanMaterial(m) {
    if (!m || !TYPES.includes(m.type) || typeof m.title !== 'string') return null;
    return { type: m.type, title: m.title.slice(0, 300), fromPage: num(m.fromPage) };
  }
  function loadTimer(storage) {
    try {
      const t = JSON.parse(storage.getItem(TIMER_KEY) || 'null');
      if (!t || !['idle', 'running', 'hold', 'paused'].includes(t.status)) return idleTimer();
      const segments = (Array.isArray(t.segments) ? t.segments : [])
        .filter((g) => g && Number.isFinite(g.start) && Number.isFinite(g.end) && g.end >= g.start)
        .map((g) => ({ start: g.start, end: g.end }));
      const material = cleanMaterial(t.material);
      const withMat = (o) => (material ? Object.assign(o, { material }) : o);
      if (t.status === 'running') {
        if (!Number.isFinite(t.runStart)) return segments.length ? withMat({ status: 'paused', segments, runStart: null }) : idleTimer();
        return withMat({ status: 'running', segments, runStart: t.runStart });
      }
      if ((t.status === 'paused' || t.status === 'hold') && segments.length) return withMat({ status: t.status, segments, runStart: null });
      return idleTimer();
    } catch (e) {
      return idleTimer();
    }
  }
  function saveTimer(storage, t) {
    storage.setItem(TIMER_KEY, JSON.stringify(t));
  }
  function exportJSON(data, now) {
    return JSON.stringify({ app: 'reading-log', exportedAt: new Date(now).toISOString(), ...data }, null, 2);
  }
  function parseFile(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error('That file isn’t valid JSON.'); }

    return sanitize(obj);

  const importJSON = parseFile; // full replace
  // MERGE: adds books and entries whose ids aren't already here; never changes existing ones,
  // so importing the same file twice adds nothing the second time. A book whose title already

  function mergeJSON(data, text) {
    const inc = parseFile(text);
    const out = JSON.parse(JSON.stringify(data));
    const bookMap = {};
    let books = 0, added = 0, skipped = 0;
    for (const b of inc.books) {
      const byId = out.books.find((x) => x.id === b.id);
      const byTitle = byId || findBook(out, b.title);
      if (byTitle) {
        bookMap[b.id] = byTitle.id;
        if (!byTitle.author && b.author) byTitle.author = b.author;
      } else { out.books.push(b); bookMap[b.id] = b.id; books++; }
    }
    const have = new Set(out.sessions.map((s) => s.id));
    for (const s of inc.sessions) {
      if (have.has(s.id)) { skipped++; continue; }
      if (s.bookId) s.bookId = bookMap[s.bookId] || s.bookId;
      out.sessions.push(s); have.add(s.id); added++;
    }
    return { data: out, added, skipped, books };
  }

    SCHEMA, KEY, TIMER_KEY, MIN, TYPES, DEFAULT_DAY_START, uid,

    idleTimer, start, pause, hold, stop, segmentsAt, elapsed, timerStart, draftFromTimer,
    sessionDay, dayTotals, todayTotal, sessionNumber, shouldCheer, streak, week,
    displayOrder, readingOrder,
    romanToInt, intToRoman, parsePages, prettyPages, pagesCount,

<script>
(function () {
  'use strict';
  const C = window.Core;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TYPE_LABEL = { book: 'BOOK', article: 'ARTICLE', poem: 'POEM' };

  const pad = (n) => String(n).padStart(2, '0');

  // ---------- pixel icons (X = current text colour) ----------
  const ICON = {

    gear: ['...X.X...', '.X.XXX.X.', '..XX.XX..', 'XXX...XXX', '.X.....X.', 'XXX...XXX', '..XX.XX..', '.X.XXX.X.', '...X.X...'],
    play: ['X......', 'XXX....', 'XXXXX..', 'XXXXXXX', 'XXXXX..', 'XXX....', 'X......'],
    stop: ['XXXXXX', 'XXXXXX', 'XXXXXX', 'XXXXXX', 'XXXXXX', 'XXXXXX'],
    pause: ['XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', 'XX..XX'],

  const ACCENT_KEY = 'readlog.accent';
  // Books on a shelf (16×12), right side of the home scene. A = accent.
  const SHELF = [
    '................',
    '............KKKK',
    '....KKKK....KAAK',
    '...KGGK.KKKKKAAK',
    '...KGGK.KWWKKKKK',
    '..KGGK..KWWKKAAK',
    '..KWWK..KKKKKAAK',
    '.KGGK...KWWKKAAK',
    '.KGGK...KWWKKAAK',
    'KGGK....KWWKKAAK',
    'KGGK....KKKKKKKK',
    'KKKKKKKKKKKKKKKK',
  ];
  const GEAR12 = ['....XXXX....', '....XXXX....', '.XX.XXXX.XX.', '.XXXXXXXXXX.', '..XXX..XXX..', 'XXXX....XXXX', 'XXXX....XXXX', '..XXX..XXX..', '.XXXXXXXXXX.', '.XX.XXXX.XX.', '....XXXX....', '....XXXX....'];
  const SPARKLE = ['...K...', '...K...', '...K...', 'KKKAKKK', '...K...', '...K...', '...K...'];
  const icon = (name, cell, cls) => C.svgPixels(ICON[name], { X: 'currentColor' }, cell || 2, 'ico ' + (cls || ''));

  // ---------- markup helpers ----------
  const win = (title, body, opts = {}) => `<section class="win"><div class="bo"><div class="bi">

  const field = (input, extra = '') => `<div class="field" ${extra}><div class="bo"><div class="bi">${input}</div></div></div>`;
  const seg = (sel, action) => `<div class="seg" role="group" aria-label="Kind"><div class="bo"><div class="bi">${C.TYPES.map((t) => `<button data-action="${action}" data-type="${t}" aria-pressed="${t === sel}">${TYPE_LABEL[t]}</button>`).join('')}</div></div></div>`;
  const chip = (label, action, on, attrs = '', cls = '') => `<button class="chip ${on ? 'on' : ''} ${cls}" data-action="${action}" ${attrs} aria-pressed="${!!on}"><span class="bo"><span class="bi">${label}</span></span></button>`;
  const holdBtn = (target, d, label) => `<button class="btn" data-hold="${target}" data-d="${d}" aria-label="${label}"><span class="bo"><span class="bi">${icon(d > 0 ? 'plus' : 'minus', 2)}</span></span></button>`;

  // localStorage can throw (private mode / disabled). Fall back to memory so the app still works.
  const storage = (() => {
    try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) {
      const m = new Map();
      setTimeout(() => toast('Storage is off — nothing will be saved'), 800);
      return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) };
    }
  })();
  const sget = (k) => { try { return storage.getItem(k); } catch (e) { return null; } };
  const sset = (k, v) => { try { storage.setItem(k, v); } catch (e) {} };
  const sdel = (k) => { try { storage.removeItem(k); } catch (e) {} };
  const jget = (k) => { try { return JSON.parse(sget(k) || 'null'); } catch (e) { return null; } };

  let data, timer;
  const ui = { tab: 'today', draft: null, save: null, entry: null, mood: null, cheerUntil: 0, archivedOpen: false, lastDay: null, homeState: null, importMode: 'replace' };

  function persist() {
    try { C.saveData(storage, data); } catch (e) { toast('Couldn’t save — phone storage full?'); }
  }
  function persistTimer() {
    try { C.saveTimer(storage, timer); } catch (e) { /* keeps running in memory */ }
  }
  const persistDraft = () => sset(DRAFT_KEY, JSON.stringify(ui.draft));
  const goalMs = () => data.settings.goalMin * C.MIN;
  const today = () => C.today(data, Date.now());
  const dayHour = () => C.dayStart(data);

  let toastTimer;
  function toast(msg) {
    $('#toastText').textContent = msg;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2600);
  }
  function shake(el) {
    if (!el) return;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }
  function bookTitle(s) {
    const b = s.bookId && data.books.find((x) => x.id === s.bookId);
    return b ? b.title : s.title || 'Untitled';
  }
  const activeBooks = () => {
    const st = C.bookStats(data);
    return data.books.filter((b) => !b.archived).sort((a, b) => (st[b.id].rank - st[a.id].rank) || (b.createdAt - a.createdAt));
  };
  const hhmm = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmtDay = (key, opts) => C.parseDay(key).toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }).replace(/,/g, '').toUpperCase();
  const readInt = (v) => { const n = parseInt(String(v).trim(), 10); return Number.isFinite(n) && n >= 0 ? n : null; };

  // ---------- the mouse ----------
  const accentId = () => (ACCENTS.some(([id]) => id === ui.accent) ? ui.accent : 'green');
  const accentHex = (id) => (ACCENTS.find(([k]) => k === (id || accentId())) || ACCENTS[1])[1];
  function setAccent(id) {
    if (!ACCENTS.some(([k]) => k === id)) return;
    ui.accent = id;
    sset(ACCENT_KEY, id);
    document.documentElement.style.setProperty('--accent', accentHex(id));
    document.documentElement.setAttribute('data-accent', id);
    ui.mood = null; // sprites are SVG with the accent baked in: redraw them
    renderAll();
  }
  const mouseSVG = (mood, cell, cls, accent, label) => C.svgPixels(C.mouseGrid(mood), C.mouseColors(accent || accentHex()), cell, cls, label);

  // sleep (no timer) · read (timer running) · cool (today's goal reached; hops for a moment when first hit)
  function currentMood() {
    const now = Date.now();
    if (now < ui.cheerUntil) return 'cool!';
    if (timer.status === 'running') return 'read';
    if (timer.status === 'hold') return 'read~'; // holding the book, not bobbing
    return C.todayTotal(data, timer, now) >= goalMs() ? 'cool' : 'sleep';
  }
  function sceneHTML(key) {
    const mood = key.replace(/[!~]/g, '');
    const anim = key === 'cool!' ? 'hop' : key === 'read' ? 'bob' : ''; // 'read~' = paused: holds still
    const label = { sleep: 'Pixel mouse, asleep', read: 'Pixel mouse, reading a book', cool: 'Pixel mouse in sunglasses: goal reached' }[mood];
    let html = mouseSVG(mood, 6, 'mouse ' + anim, null, label);
    if (mood === 'sleep') html += '<div class="zz" aria-hidden="true"><span>z</span><span>z</span></div>';
    if (mood === 'cool') {
      const sp = { K: '#111111', A: accentHex() };
      html += C.svgPixels(SPARKLE, sp, 3, 'spark a') + C.svgPixels(SPARKLE, sp, 3, 'spark b');
      html += '<div class="scene-cap">goal!</div>';
    }
    html += C.svgPixels(SHELF, { K: '#111111', G: '#B7B1AC', W: '#F4F4F4', A: accentHex() }, 4, 'shelf', 'Books on a shelf');
    return html;
  }
  function updateScene() {
    const el = $('#scene');
    if (!el) return;
    const mood = currentMood();
    if (mood === ui.mood && el.childElementCount) return;
    ui.mood = mood;
    el.innerHTML = sceneHTML(mood);
  }
  function maybeCheer() {
    if (ui.tab !== 'today' || document.visibilityState !== 'visible' || !$('#scene')) return;
    const now = Date.now();
    const k = today();
    if (!C.shouldCheer(C.todayTotal(data, timer, now), goalMs(), sget(CHEER_KEY), k)) return;
    sset(CHEER_KEY, k);
    ui.cheerUntil = now + 4500;
    toast(`Daily goal reached · ${data.settings.goalMin} min`);
  }

  // ---------- header & tabs ----------
  function renderHeader() {
    $('#date').textContent = fmtDay(today()); // the LOGICAL date
  }
  function renderTabs() {
    const tabs = [['today', 'Today', 'clock'], ['history', 'History', 'cal'], ['books', 'Books', 'books'], ['settings', 'Settings', 'gear12']];
    const tabIcon = (ic) => (ic === 'gear12' ? C.svgPixels(GEAR12, { X: 'currentColor' }, 2, 'ico') : icon(ic, 2));
    $('#tabs').innerHTML = tabs.map(([id, label, ic]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${ui.tab === id}"><span class="ib">${tabIcon(ic)}</span>${label}${id === 'today' ? '<span class="live" id="liveDot" hidden></span>' : ''}</button>`).join('');
  }

  // ---------- material chips (shared by Home and the entry form) ----------
  function chipsHTML(type, title, target) {
    const q = C.normTitle(title);
    let items = type === 'book' ? activeBooks().map((b) => b.title) : C.recentTitles(data, type, 8);
    if (q && !items.some((t) => C.normTitle(t) === q)) items = items.filter((t) => C.normTitle(t).includes(q));
    return items.slice(0, 8).map((t) => chip(esc(t), 'chip', C.normTitle(t) === q, `data-title="${esc(t)}" data-target="${target}"`)).join('') +
      chip('+ New', 'newmat', false, `data-target="${target}"`, 'new');
  }

  // ---------- pages field (shared by SAVE_SESSION and the entry form) ----------
  function pagesBlock(p, pages, override, suffix) {
    return `<label class="lbl" for="${p}Pages">Pages</label>
      ${field(`<input id="${p}Pages" value="${esc(pages)}" placeholder="33-79  or  xi-xxxi, 3-32" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`)}
      <div class="pages-sum" id="${p}Sum" data-suffix="${suffix}"></div>
      <label class="lbl" for="${p}Over">Pages read (override)</label>
      ${field(`<input id="${p}Over" inputmode="numeric" pattern="[0-9]*" value="${override ?? ''}" placeholder="optional">`)}`;
  }
  function updatePagesSum(p) {
    const el = $(`#${p}Sum`);
    if (!el) return;
    const parsed = C.parsePages($(`#${p}Pages`).value);
    const over = readInt($(`#${p}Over`).value);
    const sfx = el.dataset.suffix ? ` ${el.dataset.suffix}` : '';
    let main;
    if (over !== null) main = `= ${over} page${over === 1 ? '' : 's'}${sfx} (override)`;
    else if (parsed.ranges.length) main = `= ${parsed.count} page${parsed.count === 1 ? '' : 's'}${sfx}`;
    else main = `= ? pages${sfx}`;
    // "80-" (the prefill, or a range still being typed) is a nudge, not an error.
    const unfinished = parsed.errors.filter((x) => /^\w+\s*[-–—]$/.test(x));
    const bad = parsed.errors.filter((x) => !unfinished.includes(x));
    el.innerHTML = esc(main) +
      (unfinished.length ? `<span class="sum-hint">Type the end page after ${esc(unfinished[0])}</span>` : '') +
      (bad.length ? `<span class="sum-err">Can’t read: ${esc(bad.join(', '))}</span>` : '');
  }
  // A prefilled "33-" left untouched means "no pages".
  const finalPages = (text, prefill) => (text.trim() === (prefill || '').trim() ? '' : text.trim());

  // ---------- HOME ----------
  function homeState() {
    return timer.status === 'running' || timer.status === 'hold' ? 'running' : timer.status === 'paused' ? 'save' : 'ready';
  }
  function renderHome() {
    const st = homeState();
    ui.mood = null;
    ui.homeState = st;
    if (st === 'ready') $('#home').innerHTML = win('READING.EXE', readyHTML());

  function readyHTML() {
    const d = ui.draft;

      <div class="pickup" id="pickup"></div>

  }
  const updateChips = () => { $('#chips').innerHTML = chipsHTML(ui.draft.type, ui.draft.title, 'draft'); };
  function updatePickup() {
    const d = ui.draft;

    if (d.type === 'book' && C.normTitle(d.title)) {

  function runningHTML() {

    const key = C.timerStart(timer) || 0;

    const prefill = m && m.type === 'book' ? savePrefill(m.title) : '';
    ui.save = { key, pages: prefill, prefill, pagesTouched: false, override: '', note: '', title: '', type: ui.draft.type };

  const persistSaveForm = () => sset(SAVEFORM_KEY, JSON.stringify(ui.save));

  function saveHTML() {
    const s = ensureSaveForm();
